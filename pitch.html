<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FLUX">
<link rel="manifest" href="pitch.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FLUX · TOOLFLUX Pitch Partner</title>
<style>
/* ============ TOKENS (SIGNATURE, locked) ============ */
:root{
  --bg:#121013; --panel:#17151a; --panel2:#131114; --line:#2a262a; --line2:#242028;
  --bone:#EEE8DC; --bone-dim:#a9a193; --bone-faint:#847d72;
  --teal:#3DB8A7; --ochre:#E0A949; --rust:#C9634A; --rec:#c0564c;
  --font:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Inter',sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{ background:var(--bg); color:var(--bone); font-family:var(--font); overflow-x:hidden;
  -webkit-font-smoothing:antialiased; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; }
::selection{ background:#3db8a744; }

/* ============ COMMON ============ */
.screen{ display:none; min-height:100dvh; padding:max(18px,env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
.screen.active{ display:block; }
.meta{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; font-weight:600; color:var(--bone-faint); }
.h1{ font-size:26px; font-weight:700; letter-spacing:-.02em; margin:6px 0 2px; }
.sub{ font-size:13.5px; color:var(--bone-dim); line-height:1.6; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.spacer{ flex:1; }
.btn{ background:var(--panel); color:var(--bone); border:1px solid var(--line); border-radius:10px;
  padding:12px 18px; font-size:14.5px; font-weight:600; letter-spacing:.01em; transition:border-color .15s, transform .05s; }
.btn:active{ transform:scale(.98); }
.btn.primary{ background:linear-gradient(120deg,#1d3833,#16302c); border-color:#2c665c; color:#c9f0e8; }
.btn.danger{ border-color:#5e332c; color:#e8b0a4; }
.btn.small{ padding:8px 13px; font-size:12.5px; border-radius:8px; }
.btn[disabled]{ opacity:.4; pointer-events:none; }
.field{ margin:14px 0; }
.field label{ display:block; font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; color:var(--bone-faint); margin-bottom:7px; }
.field input[type=text],.field input[type=password],.field select{
  width:100%; background:var(--panel2); color:var(--bone); border:1px solid var(--line); border-radius:10px;
  padding:13px 14px; font-size:15px; outline:none; }
.field input:focus,.field select:focus{ border-color:#3db8a766; }
.hr{ height:1px; background:var(--line); margin:20px 0; }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0; }
a{ color:var(--teal); }

/* toasts */
#toasts{ position:fixed; top:max(10px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; width:min(94vw,560px); pointer-events:none; }
.toast{ background:#1d1a1f; border:1px solid var(--line); border-left:3px solid var(--ochre); border-radius:10px; padding:11px 14px; font-size:13.5px; color:var(--bone); box-shadow:0 8px 30px #0009; animation:tIn .25s ease; }
.toast.err{ border-left-color:var(--rust); }
.toast.ok{ border-left-color:var(--teal); }
@keyframes tIn{ from{ opacity:0; transform:translateY(-8px);} to{ opacity:1; transform:none; } }

/* bottom sheet */
#sheetWrap{ position:fixed; inset:0; background:#000a; z-index:95; display:none; align-items:flex-end; justify-content:center; }
#sheetWrap.open{ display:flex; }
#sheet{ background:#1a171c; border:1px solid var(--line); border-bottom:none; border-radius:18px 18px 0 0; width:min(100vw,640px); padding:22px 20px calc(26px + env(safe-area-inset-bottom)); animation:sUp .22s ease; }
@keyframes sUp{ from{ transform:translateY(40px); opacity:0 } to{ transform:none; opacity:1 } }
#sheet .h{ font-size:18px; font-weight:700; margin-bottom:6px; }
#sheet .b{ font-size:14px; color:var(--bone-dim); line-height:1.6; margin-bottom:16px; }
#sheet .row{ justify-content:flex-end; }

/* chips */
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.chip{ background:var(--panel2); border:1px solid var(--line); color:var(--bone-dim); border-radius:99px; padding:8px 15px; font-size:13.5px; font-weight:600; transition:all .12s; user-select:none; }
.chip.on{ border-color:#3db8a788; color:#bfe9e0; background:#16302c; }
.chip.customer{ border-radius:10px; }

/* ============ MEETING STAGE ============ */
#screen-meeting{ padding:0; position:relative; overflow:hidden; }
#stageWrap{ position:relative; height:100dvh; display:flex; flex-direction:column; }
#stageHead{ display:flex; justify-content:space-between; align-items:center; padding:max(16px,env(safe-area-inset-top)) 20px 8px; z-index:5; }
#stageHead .right{ display:flex; gap:16px; align-items:center; }
#recTag{ color:var(--rec); font-size:12px; letter-spacing:.2em; font-weight:700; }
#recTag .dot{ animation:blink 1.4s infinite; }
@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.25} }
#stateTag{ font-size:11px; letter-spacing:.2em; color:var(--bone-faint); text-transform:uppercase; font-weight:600; }
#stateTag.warn{ color:var(--ochre); }
#stateTag.bad{ color:var(--rust); }

#ribbonZone{ position:relative; transition:flex .45s cubic-bezier(.4,0,.2,1), height .45s cubic-bezier(.4,0,.2,1); flex:1; min-height:0; }
#stageWrap.asset-open #ribbonZone{ flex:0 0 56px; }
#ribbon{ width:100%; height:100%; display:block; }

#quoteZone{ padding:0 20px calc(18px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; gap:18px; align-items:flex-end; transition:opacity .3s; }
#stageWrap.asset-open #quoteZone{ display:none; }
#quoteLine{ max-width:62%; }
#quoteText{ font-size:21px; font-weight:600; letter-spacing:-.015em; line-height:1.4; color:var(--bone);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
#quoteWho{ margin-top:8px; font-size:11px; letter-spacing:.24em; font-weight:600; color:var(--bone-faint); text-transform:uppercase; }
#intel{ text-align:right; font-size:14px; color:var(--bone-dim); line-height:2; font-weight:500; min-width:150px; }
#intel .k{ font-weight:600; }
#intel .k.interest{ color:var(--teal); } #intel .k.objection{ color:var(--ochre);} #intel .k.next_step{ color:var(--rust); }

#assetStage{ flex:1; min-height:0; display:none; padding:6px 20px calc(14px + env(safe-area-inset-bottom)); }
#stageWrap.asset-open #assetStage{ display:flex; flex-direction:column; animation:plateUp .4s cubic-bezier(.3,0,.2,1); }
@keyframes plateUp{ from{ opacity:0; transform:translateY(26px) } to{ opacity:1; transform:none } }

.plate{ flex:1; min-height:0; border:1px solid var(--line); border-radius:12px; background:linear-gradient(120deg,#17151a,#131114); padding:18px 22px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
.plate .phead{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid #3db8a766; padding-bottom:12px; gap:12px; }
.plate .ptitle{ font-size:clamp(20px,3.4vw,28px); font-weight:700; letter-spacing:-.02em; }
.plate .ptitle em{ color:var(--ochre); font-style:normal; }
.plate .ptag{ font-size:10.5px; letter-spacing:.24em; color:var(--bone-faint); font-weight:600; white-space:nowrap; }
.plate .pbody{ flex:1; min-height:0; display:flex; gap:22px; margin-top:16px; }
.plate .pphoto{ flex:1.2; background:#0e0d10; border:1px solid var(--line2); border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; min-height:0; }
.plate .pphoto img{ max-width:100%; max-height:100%; object-fit:contain; }
.plate .pspecs{ flex:1; font-size:clamp(14px,2vw,17px); color:#b9b1a2; line-height:2.05; font-weight:500; overflow:auto; }
.plate .pspecs .sl{ color:var(--teal); font-weight:600; }
.plate .pspecs .sl.alt{ color:var(--ochre); }
.plate .ppitch{ margin-top:10px; font-size:13px; color:var(--bone-faint); border-top:1px solid var(--line2); padding-top:10px; }
.plate .plogo{ position:absolute; bottom:14px; right:16px; height:22px; opacity:.92; }
.plate .plogo img{ height:100%; }
.plate.mediaplate .pbody{ display:block; }
.plate video{ width:100%; height:100%; max-height:100%; border-radius:8px; background:#000; object-fit:contain; }
.plate .pdfwrap{ width:100%; height:100%; overflow:auto; text-align:center; }
.plate .pdfwrap canvas{ max-width:100%; border-radius:6px; margin:4px auto; display:block; }
.pdfnav{ position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:3; }

#stageControls{ position:absolute; bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:8; }
#stageWrap.asset-open #stageControls{ bottom:auto; top:max(12px,env(safe-area-inset-top)); left:auto; right:16px; transform:none; }
.ctl{ background:#1d1a1fd9; border:1px solid var(--line); color:var(--bone-dim); border-radius:99px; padding:11px 18px; font-size:13px; font-weight:700; letter-spacing:.08em; backdrop-filter:blur(6px); }
.ctl.answer{ border-color:#2c665c; color:#8fd8c9; }
.ctl.answer:active{ background:#16302c; }
.ctl.mute.on{ border-color:var(--ochre); color:var(--ochre); }
.ctl.mute.quiet{ border-color:var(--rust); color:var(--rust); }
.ctl.end{ border-color:#5e332c; color:#e8b0a4; }
#banner{ position:absolute; top:calc(max(16px,env(safe-area-inset-top)) + 34px); left:50%; transform:translateX(-50%); z-index:9;
  background:#241d14ee; border:1px solid #5a4622; color:#eed9b0; padding:9px 16px; border-radius:99px; font-size:12.5px; font-weight:600; display:none; }
#banner.show{ display:block; }
#banner.bad{ background:#291614ee; border-color:#5e332c; color:#e8b0a4; }

/* ============ SUMMARY ============ */
.tabs{ display:flex; gap:8px; margin:16px 0 4px; }
.tab{ background:none; border:none; border-bottom:2px solid transparent; color:var(--bone-faint); font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:8px 4px; }
.tab.on{ color:var(--bone); border-bottom-color:var(--teal); }
.doc{ display:none; }
.doc.on{ display:block; }
.mom{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px 26px 20px; margin-top:12px; }
.mom h3{ font-size:22px; font-weight:700; letter-spacing:-.02em; margin-bottom:2px; }
.mom .mm{ font-size:11px; letter-spacing:.22em; color:var(--bone-faint); text-transform:uppercase; font-weight:600; margin-bottom:16px; }
.mom h4{ font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--bone-faint); margin:20px 0 8px; }
.mom ul{ list-style:none; }
.mom li{ font-size:15.5px; line-height:1.75; color:#cfc8ba; padding-left:16px; position:relative; margin-bottom:6px; }
.mom li::before{ content:'—'; position:absolute; left:0; color:var(--bone-faint); }
.mom .sug{ background:#16302c; border:1px solid #2c665c55; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
.mom .sug .si{ font-size:16px; font-weight:700; color:#c9f0e8; }
.mom .sug .sw{ font-size:14px; color:#9fc9c0; margin-top:3px; line-height:1.6; }
.mom .sug .sd{ font-size:13.5px; color:var(--ochre); margin-top:6px; font-weight:600; }
.contactCard input{ width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--bone); border-radius:8px; padding:10px 12px; font-size:14.5px; margin-top:8px; }

/* history */
.histItem{ display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 16px; margin:10px 0; cursor:pointer; }
.histItem .n{ font-size:16.5px; font-weight:650; }
.histItem .d{ font-size:12px; color:var(--bone-faint); margin-top:3px; }
.histItem .arr{ color:var(--bone-faint); }

.backlink{ background:none; border:none; color:var(--bone-faint); font-size:12px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; padding:6px 0; }

/* gallery (debug) */
#galleryWrap .plate{ min-height:290px; margin:14px 0; flex:none; }

/* print */
#printHost{ display:none; }
@media print{
  body *{ visibility:hidden; }
  #printHost, #printHost *{ visibility:visible; }
  #printHost{ display:block; position:absolute; inset:0; background:#fff; color:#111; padding:24mm 18mm; font-family:var(--font); }
  #printHost h3{ font-size:20pt; margin-bottom:2pt; }
  #printHost .mm{ font-size:8pt; letter-spacing:.2em; text-transform:uppercase; color:#666; margin-bottom:14pt; }
  #printHost h4{ font-size:9pt; letter-spacing:.18em; text-transform:uppercase; color:#666; margin:12pt 0 5pt; }
  #printHost li{ font-size:11pt; line-height:1.7; margin-bottom:3pt; list-style:none; }
  #printHost .sug{ border:1pt solid #0a8; border-radius:6pt; padding:8pt; margin-bottom:6pt; }
  #printHost .sug .si{ font-weight:700; font-size:12pt; }
  #printHost .sug .sw{ font-size:10.5pt; }
  #printHost .sug .sd{ font-size:10pt; color:#a70; font-weight:600; }
  #printHost .plogo-print{ height:26pt; margin-bottom:10pt; }
}
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<section class="screen" id="screen-setup">
  <div class="meta">TOOLFLUX · FLUX</div>
  <div class="h1">Setup</div>
  <p class="sub">One-time on this device. Your key stays in this browser only.</p>
  <div class="field"><label>Voice engine</label>
    <select id="setProvider">
      <option value="gemini">Google Gemini Live — best Kannada, proactive listening</option>
      <option value="openai">OpenAI Realtime — fastest responses, best voices</option>

  <div id="galleryWrap" style="display:none"><div class="hr"></div><div class="meta">Plate preview</div><div id="galleryList"></div></div>

<!-- ================= HOME ================= -->
<section class="screen" id="screen-home">
  <div class="row">
    <div>
      <div class="meta">TOOLFLUX · FLUX</div>
      <div class="h1">New meeting</div>
    </div>
    <div class="spacer"></div>
    <button class="btn small" id="btnGoHistory">Meetings</button>
    <button class="btn small" id="btnGoSetup">Setup</button>

  <div class="field" style="margin-top:22px"><label>Customer</label>

<!-- ================= MEETING ================= -->
<section class="screen" id="screen-meeting">
  <div id="stageWrap">
    <div id="stageHead">
      <div class="meta" id="meetTag">TOOLFLUX · MEETING</div>
      <div class="right">
        <span id="stateTag">connecting</span>

<!-- ================= SUMMARY ================= -->
<section class="screen" id="screen-summary">
  <button class="backlink" id="btnSumBack">← Meetings</button>
  <div class="h1" id="sumTitle">Meeting summary</div>

  <div id="sumStatus" class="card" style="display:none">Generating minutes…</div>
  <div class="tabs">
    <button class="tab on" data-doc="customer">Customer MoM</button>

<script>
'use strict';
/* ================================================================
   FLUX — TOOLFLUX AI Pitch Partner
   Spec: docs/superpowers/specs/2026-07-25-pitch-partner-design.md
   ================================================================ */

/* ---------- constants ---------- */
const GEMINI_DEFAULTS = {
  apiVersion: 'v1alpha',                       // proactive audio requires v1alpha
  liveModel: 'gemini-live-2.5-flash-preview',  // overridden by auto-detect (Setup → Detect models)
  textModel: 'gemini-flash-latest',            // rolling alias — survives model retirements
  host: 'generativelanguage.googleapis.com'
};
/* Ask the key which models actually exist, so retirements never 404 us again. */
async function detectGeminiModels(key){
  const r = await fetch(`https://${GEMINI_DEFAULTS.host}/v1beta/models?key=${encodeURIComponent(key)}&pageSize=200`);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (await r.text()).slice(0, 120));
  const models = ((await r.json()).models || []).map(m => ({
    id: (m.name || '').replace(/^models\//, ''), methods: m.supportedGenerationMethods || [] }));
  const score = (id, prefs) => { let s = 0; prefs.forEach((p, i) => { if (id.includes(p)) s += (prefs.length - i) * 10; });
    if (id.includes('latest')) s += 25; if (/preview|exp/.test(id)) s -= 5;
    const v = parseFloat((id.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0); return s + v; };
  const live = models.filter(m => m.methods.includes('bidiGenerateContent'))
    .sort((a, b) => score(b.id, ['native-audio','live','flash']) - score(a.id, ['native-audio','live','flash']))[0];
  const text = models.filter(m => m.methods.includes('generateContent') && !/embed|image|tts|audio/.test(m.id))
    .sort((a, b) => score(b.id, ['flash']) - score(a.id, ['flash']))[0];
  return { live: live && live.id, text: text && text.id,
    allLive: models.filter(m => m.methods.includes('bidiGenerateContent')).map(m => m.id) };
}
const VvERIFIED = null; // (nothing invented — facts live in pitch-assets/manifest.json + prompt below)

/* ---------- tiny utils ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function b64FromInt16(int16){ let bin = ''; const u8 = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
  const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(bin); }
function int16FromB64(b64){ const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return new Int16Array(u8.buffer); }

/* ---------- IndexedDB ---------- */
let _db = null;
function openDB(){ return new Promise((res, rej) => {
  const rq = indexedDB.open('flux_db', 1);
  rq.onupgradeneeded = () => { const d = rq.result;
    d.createObjectStore('customers', { keyPath:'id' }).createIndex('nameLower','nameLower');
    d.createObjectStore('meetings', { keyPath:'id' }).createIndex('customerId','customerId');
    d.createObjectStore('chunks', { keyPath:'id' }).createIndex('meetingId','meetingId'); };
  rq.onsuccess = () => { _db = rq.result; res(); }; rq.onerror = () => rej(rq.error); }); }
function tx(store, mode){ return _db.transaction(store, mode).objectStore(store); }
const dbPut = (s,o) => new Promise((res,rej) => { const r = tx(s,'readwrite').put(o); r.onsuccess=res; r.onerror=()=>rej(r.error); });
const dbGet = (s,k) => new Promise((res,rej) => { const r = tx(s,'readonly').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbDel = (s,k) => new Promise((res,rej) => { const r = tx(s,'readwrite').delete(k); r.onsuccess=res; r.onerror=()=>rej(r.error); });
const dbAll = (s, idx, val) => new Promise((res,rej) => {
  const st = tx(s,'readonly'); const src = idx ? st.index(idx) : st;
  const r = val !== undefined ? src.getAll(val) : src.getAll();
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

/* ---------- asset registry ---------- */
const Registry = { products: new Map(), media: new Map(), aliases: new Map(), loaded: false };

async function loadRegistry(force){
  Registry.products.clear(); Registry.media.clear(); Registry.aliases.clear();
  try {
    const mf = await (await fetch('pitch-assets/manifest.json' + (force ? '?t=' + Date.now() : ''))).json();
    (mf.products || []).forEach(p => Registry.products.set(p.id, p));
  } catch (e) { console.warn('manifest.json missing', e); }
  try {
    const resp = await fetch('pitch-assets/library.xlsx' + (force ? '?t=' + Date.now() : ''));
    if (resp.ok) {
      if (!window.XLSX) await loadScript('pitch-assets/xlsx.min.js');
      const wb = XLSX.read(await resp.arrayBuffer(), { type:'array' });
      const prod = wb.Sheets['Products'] ? XLSX.utils.sheet_to_json(wb.Sheets['Products']) : [];
      const med = wb.Sheets['Media'] ? XLSX.utils.sheet_to_json(wb.Sheets['Media']) : [];
      prod.forEach(p => { if (p.id) Registry.products.set(String(p.id).trim(), normalizeProduct(p)); });
      med.forEach(m => { if (m.id && m.file) { const mm = { id:String(m.id).trim(), file:String(m.file).trim(),
        caption:String(m.caption || ''), aliases:String(m.say_when_asked || '').split(',').map(a => a.trim().toLowerCase()).filter(Boolean) };
        Registry.media.set(mm.id, mm); mm.aliases.forEach(a => Registry.aliases.set(a, mm.id)); Registry.aliases.set(mm.id.toLowerCase(), mm.id); } });
    }
  } catch (e) { console.warn('library.xlsx not loaded', e); }
  Registry.loaded = true;
  return { products: Registry.products.size, media: Registry.media.size };
}
function normalizeProduct(p){
  const out = { id:String(p.id).trim(), name:String(p.name || p.id), family:String(p.family || ''), pitch_line:String(p.pitch_line || ''),
    promote: /^y/i.test(String(p.promote || '')) };
  for (let i = 1; i <= 6; i++) if (p['spec' + i]) out['spec' + i] = String(p['spec' + i]);
  return out;
}

/* logo contrast: average luminance of an img (or null → dark panel) */
function pickLogo(imgEl){
  let lum = 24; // panel default = dark
  if (imgEl && imgEl.naturalWidth) {
    try { const c = document.createElement('canvas'); c.width = c.height = 8;
      const g = c.getContext('2d'); g.drawImage(imgEl, 0, 0, 8, 8);
      const d = g.getImageData(0, 0, 8, 8).data; let t = 0;
      for (let i = 0; i < d.length; i += 4) t += 0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2];
      lum = t / 64;
    } catch {}
  }
  return lum > 140 ? 'pitch-assets/logo-dark.svg' : 'pitch-assets/logo-light.svg';
}

    const val = rest.join(':').trim();
    specs.push(val ? `<div><span class="sl ${i % 2 ? '' : 'alt'}">${esc(l.trim())}</span> — ${esc(val)}</div>`
                   : `<div>${esc(l.trim())}</div>`);
  }
  const nameHtml = esc(p.name).replace(/(SUPER-U|HYPER-U|TFX-[A-Z0-9/ ]+)/, '<em>$1</em>');
  div.innerHTML = `
    <div class="phead"><div class="ptitle">${nameHtml}</div><div class="ptag">${esc(p.family || 'TOOLFLUX')} · PLATE ${String(plateNo || 1).padStart(2,'0')}</div></div>
    <div class="pbody">
      <div class="pphoto"><img alt="" style="display:none"></div>
      <div class="pspecs">${specs.join('') || '<div>' + esc(p.pitch_line) + '</div>'}</div>
    </div>
    ${p.pitch_line && specs.length ? `<div class="ppitch">${esc(p.pitch_line)}</div>` : ''}
    <div class="plogo"><img src="pitch-assets/logo-light.svg" alt="TOOLFLUX"></div>`;
  const img = div.querySelector('.pphoto img'); const logo = div.querySelector('.plogo img');
  const tryExt = ['jpg','png','jpeg','webp']; let ti = 0;

async function renderMediaPlate(m){

        const page = await pdf.getPage(n);
        const vp = page.getViewport({ scale: Math.min(2, (wrap.clientWidth || 800) / page.getViewport({scale:1}).width * window.devicePixelRatio) });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;

          b.onclick = () => { pageNo = Math.min(pdf.numPages, Math.max(1, pageNo + d)); renderPage(pageNo); }; return b; };

/* resolve spoken media name → media entry */
function resolveMedia(q){
  q = String(q || '').trim().toLowerCase();
  if (Registry.media.has(q)) return Registry.media.get(q);
  if (Registry.aliases.has(q)) return Registry.media.get(Registry.aliases.get(q));
  for (const [alias, id] of Registry.aliases) if (q.includes(alias) || alias.includes(q)) return Registry.media.get(id);
  return null;
}
function resolveProduct(q){
  q = String(q || '').trim().toLowerCase();
  if (Registry.products.has(q)) return Registry.products.get(q);
  for (const p of Registry.products.values())
    if (p.id.toLowerCase() === q || p.name.toLowerCase() === q) return p;
  for (const p of Registry.products.values())
    if (p.name.toLowerCase().includes(q) || q.includes(p.id.toLowerCase())) return p;
  return null;
}

/* ================================================================
   AUDIO ENGINE
   ================================================================ */
const AudioEngine = {
  ctx: null, micStream: null, workletNode: null, playGain: null, recDest: null, recorder: null,
  playQueue: [], nextPlayTime: 0, activeSources: new Set(),
  micLevel: 0, fluxLevel: 0, onFrame: null, meetingId: null, seq: 0, wakeLock: null, muted: false, gain: 1.6,

  async start(meetingId, targetRate){
    this.meetingId = meetingId; this.seq = 0; this.targetRate = targetRate || 16000;
    this.gain = settings.micGain || 1.6;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await this.ctx.resume();
    this.micStream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    const src = this.ctx.createMediaStreamSource(this.micStream);

    /* capture worklet: passthrough of raw float frames to main thread */
    const workletCode = `class FluxCap extends AudioWorkletProcessor{
      process(inputs){ const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; } }
      registerProcessor('flux-cap', FluxCap);`;
    const url = URL.createObjectURL(new Blob([workletCode], { type:'application/javascript' }));
    await this.ctx.audioWorklet.addModule(url);
    this.workletNode = new AudioWorkletNode(this.ctx, 'flux-cap');
    src.connect(this.workletNode);

    /* resample to target rate PCM16, batch ~50ms for low latency */
    const inRate = this.ctx.sampleRate; let acc = new Float32Array(0); let outAcc = [];
    let ratio = inRate / this.targetRate;
    const batchSamples = Math.round(this.targetRate / 20); // 50 ms
    this.workletNode.port.onmessage = ev => {
      const f = ev.data;
      /* mic level (RMS, smoothed) */
      let s = 0; for (let i = 0; i < f.length; i++) s += f[i]*f[i];
      this.micLevel = this.micLevel * .82 + Math.sqrt(s / f.length) * .18;
      const joined = new Float32Array(acc.length + f.length); joined.set(acc); joined.set(f, acc.length); acc = joined;
      const outLen = Math.floor(acc.length / ratio);
      if (!outLen) return;
      /* box-average decimation: averaging the samples inside each output window acts as a
         low-pass filter. Nearest-sample picking aliases high frequencies down into speech
         range and wrecks recognition — this is the difference between "shitty pickup" and clean. */
      const out = new Int16Array(outLen);
      const win = Math.max(1, Math.floor(ratio));
      for (let i = 0; i < outLen; i++) {
        const start = Math.floor(i * ratio); let sum = 0, n = 0;
        for (let k = 0; k < win && start + k < acc.length; k++) { sum += acc[start + k]; n++; }
        let v = n ? sum / n : 0;
        v *= this.gain;
        out[i] = Math.max(-1, Math.min(1, v)) * 0x7FFF;
      }
      acc = acc.subarray(Math.floor(outLen * ratio));
      outAcc.push(out);
      const total = outAcc.reduce((n, a) => n + a.length, 0);
      if (total >= batchSamples) {
        const merged = new Int16Array(total); let o = 0;
        outAcc.forEach(a => { merged.set(a, o); o += a.length; }); outAcc = [];
        if (this.onFrame) this.onFrame(b64FromInt16(merged));
      }
    };

    /* playback path + recorder mix */
    this.playGain = this.ctx.createGain(); this.playGain.connect(this.ctx.destination);
    this.recDest = this.ctx.createMediaStreamDestination();
    src.connect(this.recDest); this.playGain.connect(this.recDest);
    this.nextPlayTime = 0;

    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
               : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    this.recorder = new MediaRecorder(this.recDest.stream, mime ? { mimeType: mime } : undefined);
    this.recorder.ondataavailable = async e => { if (e.data && e.data.size)
      await dbPut('chunks', { id: uid(), meetingId: this.meetingId, seq: this.seq++, blob: e.data }).catch(()=>{}); };
    this.recorder.start(4000);
    this.audioMime = this.recorder.mimeType || mime || 'audio/webm';

    try { this.wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    document.addEventListener('visibilitychange', this._reWake);
    return this.audioMime;
  },
  _reWake: async () => { if (document.visibilityState === 'visible' && Meeting.active) {
    try { AudioEngine.wakeLock = await navigator.wakeLock.request('screen'); } catch {} } },

  playChunk(b64){
    if (!this.ctx || this.muted) { /* muted: still count level 0 */ }
    const int16 = int16FromB64(b64);
    const f32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 0x8000;
    /* flux level from chunk energy */
    let s = 0; for (let i = 0; i < f32.length; i += 8) s += f32[i]*f32[i];
    this.fluxLevel = Math.min(1, Math.sqrt(s / (f32.length / 8)) * 3);
    setTimeout(() => { this.fluxLevel *= .5; }, 400);
    if (this.muted) return;
    const buf = this.ctx.createBuffer(1, f32.length, 24000);
    buf.copyToChannel(f32, 0);
    const node = this.ctx.createBufferSource(); node.buffer = buf; node.connect(this.playGain);
    const t = Math.max(this.ctx.currentTime + 0.04, this.nextPlayTime);
    node.start(t); this.nextPlayTime = t + buf.duration;
    this.activeSources.add(node); node.onended = () => this.activeSources.delete(node);
  },
  bargeIn(){ this.activeSources.forEach(s => { try { s.stop(); } catch {} }); this.activeSources.clear();
    this.nextPlayTime = 0; },
  setMuted(m){ this.muted = m; if (m) this.bargeIn(); },
  async stop(){
    document.removeEventListener('visibilitychange', this._reWake);
    try { this.wakeLock && await this.wakeLock.release(); } catch {}
    if (this.recorder && this.recorder.state !== 'inactive') {
      await new Promise(res => { this.recorder.onstop = res; this.recorder.stop(); });
    }
    this.micStream && this.micStream.getTracks().forEach(t => t.stop());
    this.workletNode && this.workletNode.disconnect();
    this.ctx && await this.ctx.close().catch(()=>{});
    this.ctx = null; this.recorder = null; this.micStream = null;
  }
};

/* ================================================================
   GEMINI LIVE CLIENT
   ================================================================ */
class LiveClient {
  constructor(opts){ Object.assign(this, { ws:null, state:'idle', resumeHandle:null, backoff:1000,
    closing:false, onState:()=>{}, onAudio:()=>{}, onInTranscript:()=>{}, onOutTranscript:()=>{},
    onToolCall:()=>{}, onInterrupted:()=>{}, onTurnComplete:()=>{}, textOnly:false, systemPrompt:'', tools:[] }, opts); }

  url(){ return `wss://${GEMINI_DEFAULTS.host}/ws/google.ai.generativelanguage.${settings.apiVersion}.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(settings.apiKey)}`; }

  connect(){
    this.closing = false;
    this._setState('connecting');
    let ws;
    try { ws = new WebSocket(this.url()); } catch (e) { this._fail(e); return; }
    this.ws = ws;
    ws.onopen = () => {
      const setup = {
        model: 'models/' + settings.liveModel,
        generationConfig: { responseModalities: ['AUDIO'],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: settings.voice } } } },
        systemInstruction: { parts: [{ text: this.systemPrompt }] },
        inputAudioTranscription: {}, outputAudioTranscription: {},
        proactivity: { proactiveAudio: true },
        realtimeInputConfig: { automaticActivityDetection: {
          startOfSpeechSensitivity: 'START_SENSITIVITY_HIGH',
          endOfSpeechSensitivity: 'END_SENSITIVITY_HIGH',
          prefixPaddingMs: 60, silenceDurationMs: 500 } },
        contextWindowCompression: { slidingWindow: {} },
        sessionResumption: this.resumeHandle ? { handle: this.resumeHandle } : {}
      };
      if (this.tools.length) setup.tools = [{ functionDeclarations: this.tools }];
      ws.send(JSON.stringify({ setup }));
    };
    ws.onmessage = async ev => {
      let data = ev.data;
      if (data instanceof Blob) data = await data.text();
      let msg; try { msg = JSON.parse(data); } catch { return; }
      this._handle(msg);
    };
    ws.onerror = () => {};
    ws.onclose = ev => {
      if (this.closing) { this._setState('closed'); return; }
      this._setState('reconnecting');
      const wait = Math.min(this.backoff, 10000); this.backoff = Math.min(this.backoff * 1.8, 10000);
      setTimeout(() => { if (!this.closing) this.connect(); }, wait);
    };
  }

  _handle(msg){
    if (msg.setupComplete !== undefined) { this.backoff = 1000; this._setState('live'); return; }
    if (msg.sessionResumptionUpdate) {
      const h = msg.sessionResumptionUpdate.newHandle || msg.sessionResumptionUpdate.new_handle;
      if (h && msg.sessionResumptionUpdate.resumable !== false) this.resumeHandle = h;
      return;
    }
    if (msg.goAway) { /* server about to drop: reconnect proactively */ try { this.ws.close(); } catch {} return; }
    if (msg.toolCall && msg.toolCall.functionCalls) { this.onToolCall(msg.toolCall.functionCalls); return; }
    const sc = msg.serverContent;
    if (!sc) return;
    if (sc.interrupted) this.onInterrupted();
    if (sc.inputTranscription && sc.inputTranscription.text) this.onInTranscript(sc.inputTranscription.text);
    if (sc.outputTranscription && sc.outputTranscription.text) this.onOutTranscript(sc.outputTranscription.text);
    if (sc.modelTurn && sc.modelTurn.parts) sc.modelTurn.parts.forEach(p => {
      if (p.inlineData && p.inlineData.data) this.onAudio(p.inlineData.data); });
    if (sc.turnComplete) this.onTurnComplete();
  }

  sendAudio(b64){ if (this.ws && this.ws.readyState === 1 && this.state === 'live')
    this.ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64, mimeType: 'audio/pcm;rate=16000' } } })); }
  sendText(text /* , wantResponse — Gemini decides itself, param ignored */){ if (this.ws && this.ws.readyState === 1)
    this.ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text }] }], turnComplete: true } })); }
  sendToolResponse(responses){ if (this.ws && this.ws.readyState === 1)
    this.ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } })); }
  forceAnswer(){ this.sendText('[OWNER NOTE] Answer the last thing said to you right now, in one short sentence.'); }
  close(){ this.closing = true; try { this.ws && this.ws.close(); } catch {} }
  _setState(s){ this.state = s; this.onState(s); }
  _fail(e){ this._setState('error'); console.error(e); }
}

   OPENAI REALTIME CLIENT (same callback interface as LiveClient)
   ================================================================ */
function toJsonSchema(s){ /* Gemini UPPERCASE schema → standard JSON schema */
  if (!s || typeof s !== 'object') return s;
  const out = Array.isArray(s) ? [] : {};
  for (const k of Object.keys(s)) out[k] = toJsonSchema(s[k]);
  if (typeof out.type === 'string') out.type = out.type.toLowerCase();
  return out;
}
class OpenAIClient {
  constructor(opts){ Object.assign(this, { ws:null, state:'idle', backoff:1000, closing:false,
    onState:()=>{}, onAudio:()=>{}, onInTranscript:()=>{}, onOutTranscript:()=>{},
    onToolCall:()=>{}, onInterrupted:()=>{}, onTurnComplete:()=>{},
    systemPrompt:'', tools:[], _inDeltaItems:new Set(), _responding:false }, opts); }

  connect(){
    this.closing = false; this._setState('connecting');
    let ws;
    try {
      ws = new WebSocket('wss://api.openai.com/v1/realtime?model=' + encodeURIComponent(settings.openaiModel),
        ['realtime', 'openai-insecure-api-key.' + settings.openaiKey, 'openai-beta.realtime-v1']);
    } catch (e) { this._setState('error'); return; }
    this.ws = ws;
    ws.onopen = () => {
      ws.send(JSON.stringify({ type:'session.update', session:{
        modalities:['audio','text'],
        instructions: this.systemPrompt,
        voice: settings.openaiVoice,
        input_audio_format:'pcm16', output_audio_format:'pcm16',
        input_audio_transcription:{ model:'gpt-4o-mini-transcribe' },
        /* semantic VAD reads the words to decide you've finished, instead of waiting out silence —
           much faster and far fewer mid-sentence cut-ins. eagerness high = 2s fallback timeout. */
        turn_detection:{ type:'semantic_vad', eagerness:'high', interrupt_response:true, create_response:true },
        tools: this.tools.map(t => ({ type:'function', name:t.name, description:t.description,
          parameters: toJsonSchema(t.parameters || { type:'OBJECT', properties:{} }) })),
        tool_choice:'auto'
      }}));
    };
    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch { return; } this._handle(m); };
    ws.onclose = () => {
      if (this.closing) { this._setState('closed'); return; }
      this._setState('reconnecting');
      const wait = Math.min(this.backoff, 10000); this.backoff = Math.min(this.backoff * 1.8, 10000);
      setTimeout(() => { if (!this.closing) this.connect(); }, wait);
    };
  }

  _handle(m){
    const t = m.type || '';
    if (t === 'session.updated') { this.backoff = 1000; this._setState('live'); return; }
    if (t === 'response.created') { this._responding = true; return; }
    if (t === 'response.audio.delta' || t === 'response.output_audio.delta') { this.onAudio(m.delta); return; }
    if (t === 'response.audio_transcript.delta' || t === 'response.output_audio_transcript.delta') { this.onOutTranscript(m.delta); return; }
    if (t === 'conversation.item.input_audio_transcription.delta') {
      if (m.delta) { this._inDeltaItems.add(m.item_id); this.onInTranscript(m.delta); } return; }
    if (t === 'conversation.item.input_audio_transcription.completed') {
      if (!this._inDeltaItems.has(m.item_id) && m.transcript) this.onInTranscript(m.transcript);
      this._inDeltaItems.delete(m.item_id); return; }
    if (t === 'input_audio_buffer.speech_started') {
      this.onInterrupted();
      if (this._responding) { this._send({ type:'response.cancel' }); this._responding = false; }
      return; }
    if (t === 'response.function_call_arguments.done') {
      let args = {}; try { args = JSON.parse(m.arguments || '{}'); } catch {}
      this.onToolCall([{ id: m.call_id, name: m.name, args }]); return; }
    if (t === 'response.done') { this._responding = false; this.onTurnComplete(); return; }
    if (t === 'error') { console.warn('openai error', m.error);
      if (m.error && /invalid|auth|key/i.test(m.error.message || '')) { this.closing = true; this._setState('error'); try { this.ws.close(); } catch {} }
      return; }
  }

  _send(o){ if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
  sendAudio(b64){ if (this.state === 'live') this._send({ type:'input_audio_buffer.append', audio:b64 }); }
  sendText(text, wantResponse){
    this._send({ type:'conversation.item.create', item:{ type:'message', role:'user', content:[{ type:'input_text', text }] } });
    if (wantResponse) this._send({ type:'response.create' });
  }
  sendToolResponse(responses){
    let silent = false;
    responses.forEach(r => { if (r.name === 'stay_silent') silent = true;
      this._send({ type:'conversation.item.create', item:{ type:'function_call_output', call_id:r.id, output: JSON.stringify(r.response) } }); });
    if (!silent) this._send({ type:'response.create' });
  }
  forceAnswer(){ this._send({ type:'input_audio_buffer.commit' });
    this._send({ type:'response.create', response:{ instructions:'Answer the last thing said to you right now, in one short sentence.' } }); }
  close(){ this.closing = true; try { this.ws && this.ws.close(); } catch {} }
  _setState(s){ this.state = s; this.onState(s); }
}

/* ---------- system prompt ---------- */
function buildSystemPrompt(meeting, customerName){
  const catalog = [...Registry.products.values()].map(p =>
    `- ${p.id} · ${p.name}${p.family ? ' (' + p.family + ')' : ''}${p.pitch_line ? ' — ' + p.pitch_line : ''}`).join('\n');
  const mediaList = [...Registry.media.values()].map(m => `- ${m.id} ("${m.aliases.join('", "')}")${m.caption ? ' — ' + m.caption : ''}`).join('\n');
  const push = (meeting.pushIds || []).map(id => { const p = Registry.products.get(id); return p ? p.name : id; }).join(', ');
  return `You are FLUX — TOOLFLUX's AI sales partner, live IN THE ROOM during a real face-to-face sales meeting in India. ${settings.ownerName} (the owner, your partner) is pitching TOOLFLUX cutting tools to a customer${customerName ? ' from ' + customerName : ''}. You hear everyone through one microphone. You are a colleague, not an appliance.

## COMPANY FACTS (the only claims you may make)
- TOOLFLUX: carbide cutting tools supplier, based in Hubli, Karnataka. Delivers pan-India. Phone/WhatsApp +91 8660234766 · toolflux.co.in
- Product families: carbide inserts (turning, milling, threading, grooving, CBN, drilling), end mills, solid carbide drills, indexable milling holders (HFMA/HFMB high-feed, D16–D63), turning holders, U-Drill (SUPER-U general purpose, HYPER-U high performance, Ø8.5–70 mm, 2D/3D/5D, SPMG + WCMX inserts)
- Grades: TFX-P25 (ISO P steel, AlTiN) · TFX-M35 (ISO M stainless, TiSiN) · TFX-K20 (ISO K cast iron, TiCN) · TFX-U15 (ISO N aluminium) · TFX-S30 (ISO S superalloys) · TFX-H15/H10 (CBN, up to 60 HRC)
- Same-day dispatch on stock items. On-site application support.
NEVER invent specs, prices, client names or delivery promises beyond these. If asked something you don't know, say ${settings.ownerName} will confirm it — smoothly, never robotically. Never mention other tool brands; everything you show and discuss is TOOLFLUX.

## HOW YOU BEHAVE (balanced co-pilot)
- Languages: the room mixes English, Hindi and Kannada freely. Understand all three; reply in the same mix the room is using.
- Speak when: (1) someone addresses you ("Flux…"), (2) ${settings.ownerName} cues you ("Flux, tell them about…"), (3) there is a CLEAR opening — e.g. the customer names a problem a TOOLFLUX product solves. Then be brief, warm and concrete.
- Stay silent when ${settings.ownerName} or the customer is mid-flow. Never talk over people. When in doubt, stay quiet. Short reactions ("haan", "correct sir") are allowed sparingly.
- LENGTH — HARD LIMIT: normally ONE sentence. Two only if genuinely needed. Never three. Never a paragraph, never a list read aloud, never a summary of what was just said. If you feel a long explanation coming, say the single most useful line and stop — ${settings.ownerName} carries the rest. Long answers kill the meeting; brevity is your whole job.
- SPEAK IMMEDIATELY when addressed. If someone says "Flux" or asks you anything directly, answer at once — never go silent on a direct question. If you did not catch it, say "sorry sir, once more?" in one breath rather than staying quiet.
- You are CONVERSATIONAL: contractions, warmth, natural rhythm.
- Greet a NEW voice you haven't heard yet in the meeting: welcome them warmly, ask how their day is going. Do this once per person, briefly.
- If anyone asks what you are: always a witty, warm one-liner first (e.g. "I'm the only TOOLFLUX employee who works without chai — Flux, at your service"), then one plain sentence. Vary it; never sound canned twice.
- Humour: positive jokes only, and only when the room is light. Machining humour is welcome ("that joke had more chatter than a worn-out insert"). Never joke about the customer, their company, or during tense price talk.
- TODAY'S PUSH: ${push || '(none set)'}. Push these ONLY when ${settings.ownerName} and the customer are already dwelling on that topic — then reinforce with data and offer to show the plate. NEVER cold-pivot to a push product.
- TOPIC DISCIPLINE: you exist for machining and cutting tools. Never dive deep into unrelated topics (politics, cricket, films, tech news, anything else) — even if asked directly, give at most one light sentence and steer back naturally to the shop, their parts, their machining problems, or TOOLFLUX ("…but tell me sir, what's that VMC of yours running these days?"). If the customer shares a personal story or experience, that is THEIR moment: do not react, comment or add your own take — stay silent and let it breathe. Your only permitted touch there is a well-timed light joke IF the mood clearly invites one; otherwise nothing.
- Wrap-up: when the meeting is clearly closing, remind gently and ask the customer for email/phone "so we can send you a proper summary" — then capture_contact.
- If an [OWNER NOTE] appears in the conversation, it is a silent instruction from ${settings.ownerName} to you: obey it and never read it aloud.

## YOUR SCREEN TOOLS
Use show_asset the moment you start talking about a specific product/grade (the screen is part of your pitch). Use log_signal silently for every interest / objection / agreed next step you hear. Videos: cue a relevant one yourself only when the conversation is already there; always play a specifically named one on request.

### Asset catalog (id · name — one-liner)
${catalog || '(none loaded)'}

### Media (id ("spoken names") — caption)
${mediaList || '(none loaded)'}

## FRESHNESS (hard rule)
Variety seed for this meeting: ${Math.random().toString(36).slice(2, 8)}. Invent a NEW greeting, NEW day-question, NEW witty identity answer and NEW jokes every single meeting — never a line you have used before. These exact lines are BANNED (used in earlier meetings — do not repeat them or lightly rephrase them):
${getUsedLines().map(l => '- "' + l + '"').join('\n') || '(none yet — everything is fresh)'}
${settings.provider === 'openai' ? `
## SILENCE DISCIPLINE (critical)
The audio system prompts you after every pause in speech. You have a stay_silent tool: call it INSTEAD of speaking whenever ${settings.ownerName} or the customer is mid-flow, or you have nothing genuinely valuable to add. MOST turns should be stay_silent — a good colleague listens far more than he talks. Never speak just because the system lets you. When you do speak, keep it short and land it.` : ''}`;
}

const Meeting = {
  active: null, client: null, timerIv: null, startTs: 0, saveIv: null,
  curLine: null, transcript: [], signals: [], contacts: [], quiet: false, degraded: false,
  assetOpen: false, plateCount: 0,

  async start(customer, pushIds, rehearsal){
    const id = uid();
    const existing = customer.id === 'rehearsal' ? [] : await dbAll('meetings', 'customerId', customer.id);
    const m = { id, customerId: customer.id, customerName: customer.name, number: existing.length + 1,
      startedAt: Date.now(), endedAt: null, rehearsal: !!rehearsal, pushIds, signals: [], contacts: [],
      transcript: [], summary: null, audioMime: '', status: 'live' };
    this.active = m; this.transcript = m.transcript; this.signals = m.signals; this.contacts = m.contacts;
    this.curLine = null; this.quiet = false; this.degraded = false; this.assetOpen = false; this.plateCount = 0; this._wasLive = false;
    await dbPut('meetings', m);

    $('#meetTag').textContent = `TOOLFLUX · ${rehearsal ? 'REHEARSAL' : 'MEETING ' + String(m.number).padStart(2,'0')} · ${customer.name.toUpperCase()}`;
    $('#quoteText').textContent = 'Flux is listening…'; $('#quoteWho').textContent = 'FLUX · READY';
    $('#intel').innerHTML = ''; this.closeAsset(true);
    $('#btnMute').className = 'ctl mute'; $('#btnMute').textContent = 'MUTE FLUX';
    show('meeting');

    const rate = settings.provider === 'openai' ? 24000 : 16000;
    try { m.audioMime = await AudioEngine.start(id, rate); await dbPut('meetings', m); }
    catch (e) { toast('Microphone blocked — allow mic access and retry.', 'err'); show('home'); return; }

    this.startTs = Date.now();
    this.timerIv = setInterval(() => { $('#recTime').textContent = fmtTime(Date.now() - this.startTs); }, 500);
    this.saveIv = setInterval(() => this.persist(), 3000);

    const Client = settings.provider === 'openai' ? OpenAIClient : LiveClient;
    this.client = new Client({
      systemPrompt: buildSystemPrompt(m, customer.name), tools: providerTools(),
      onState: s => this.onClientState(s),
      onAudio: b64 => AudioEngine.playChunk(b64),
      onInterrupted: () => AudioEngine.bargeIn(),
      onInTranscript: t => this.addTranscript('room', t),
      onOutTranscript: t => this.addTranscript('flux', t),
      onTurnComplete: () => this.flushLine(),
      onToolCall: calls => this.handleTools(calls)
    });
    AudioEngine.onFrame = b64 => this.client && this.client.sendAudio(b64);
    this.client.connect();
    Ribbon.start();
  },

  onClientState(s){
    const tag = $('#stateTag'); tag.className = '';
    if (s === 'live') { tag.textContent = 'flux live'; this.hideBanner(); this.degraded = false;
      /* OpenAI reconnects start a fresh session — silently restore recent context */
      if (this._wasLive && settings.provider === 'openai' && this.client && this.transcript.length) {
        const recap = this.transcript.slice(-15).map(l => (l.who === 'flux' ? 'YOU said' : 'ROOM said') + ': ' + l.text.trim().slice(0, 160)).join('\n');
        this.client.sendText('[OWNER NOTE] The connection dropped and reconnected — same meeting, do not greet anyone again. Recent conversation recap:\n' + recap);
      }
      this._wasLive = true; }
    else if (s === 'connecting') { tag.textContent = 'connecting'; }
    else if (s === 'reconnecting') { tag.textContent = 'reconnecting'; tag.className = 'warn';
      this.showBanner('Connection dropped — reconnecting. Recording continues.', false);
      /* after 25s of failed reconnects → degraded */
      clearTimeout(this._degTimer);
      this._degTimer = setTimeout(() => { if (this.client && this.client.state !== 'live') {
        this.degraded = true; tag.textContent = 'recorder only'; tag.className = 'bad';
        this.showBanner('No network — Flux is out, recording continues. It will rejoin when the network returns.', true); } }, 25000);
    } else if (s === 'error') { tag.textContent = 'error'; tag.className = 'bad';
      this.showBanner('Gemini connection error — Flux muted, recording continues.', true); }
  },
  showBanner(text, bad){ const b = $('#banner'); b.textContent = text; b.className = 'show' + (bad ? ' bad' : ''); },
  hideBanner(){ $('#banner').className = ''; clearTimeout(this._degTimer); },

  addTranscript(who, text){
    if (!text) return;
    if (this.curLine && this.curLine.who === who) this.curLine.text += text;
    else { this.flushLine(); this.curLine = { t: Date.now(), who, text }; }
    const q = this.curLine;
    $('#quoteText').textContent = '“' + q.text.trim().slice(-220) + '”';
    $('#quoteWho').textContent = (who === 'flux' ? 'FLUX' : 'ROOM') + ' · ' + (who === 'flux' ? 'SPEAKING' : 'TALKING');
  },
  flushLine(){ if (this.curLine && this.curLine.text.trim()) this.transcript.push(this.curLine); this.curLine = null; },

  renderIntel(){
    const last = {}; this.signals.slice(-9).forEach(s => { last[s.kind] = last[s.kind] || []; last[s.kind].push(s.note); });
    const lbl = { interest:'Interest', objection:'Objection', next_step:'Next' };
    $('#intel').innerHTML = Object.keys(lbl).filter(k => last[k])
      .map(k => `<div><span class="k ${k}">${lbl[k]}</span> — ${esc(last[k][last[k].length-1])}</div>`).join('');
  },

  async handleTools(calls){
    const responses = [];
    for (const c of calls) {
      let result = 'ok';
      try {
        if (c.name === 'show_asset') {
          const p = resolveProduct(c.args && c.args.id);
          if (p) { await this.openPlate(renderPlate(p, ++this.plateCount)); result = 'shown: ' + p.name; }
          else result = 'not found. valid ids: ' + [...Registry.products.keys()].join(', ');
        } else if (c.name === 'show_media') {
          const m = resolveMedia(c.args && c.args.name);
          if (m) { await this.openPlate(await renderMediaPlate(m)); result = 'playing: ' + m.id; }
          else result = 'not found. media: ' + [...Registry.media.keys()].join(', ');
        } else if (c.name === 'hide_stage') { this.closeAsset(); result = 'cleared';
        } else if (c.name === 'log_signal') {
          this.signals.push({ t: Date.now(), kind: c.args.kind, note: c.args.note }); this.renderIntel(); result = 'noted';
        } else if (c.name === 'capture_contact') {
          this.contacts.push(Object.assign({ t: Date.now() }, c.args)); result = 'saved';
        } else if (c.name === 'stay_silent') { result = 'ok';
        } else result = 'unknown tool';
      } catch (e) { result = 'error: ' + e.message; }
      responses.push({ id: c.id, name: c.name, response: { result } });
    }
    this.client && this.client.sendToolResponse(responses);
    this.persist();
  },

  async openPlate(node){
    const stage = $('#assetStage'); stage.innerHTML = ''; stage.appendChild(node);
    $('#stageWrap').classList.add('asset-open'); $('#btnHideAsset').style.display = '';
    this.assetOpen = true; Ribbon.resize();
  },
  closeAsset(silent){
    $('#stageWrap').classList.remove('asset-open'); $('#assetStage').innerHTML = '';
    $('#btnHideAsset').style.display = 'none'; this.assetOpen = false; Ribbon.resize();
    if (!silent && this.client) { /* nothing to send; model calls hide_stage itself when it wants */ }
  },

  toggleMute(){
    const b = $('#btnMute');
    if (this.quiet) { /* exit quiet + unmute */
      this.quiet = false; AudioEngine.setMuted(false); b.className = 'ctl mute'; b.textContent = 'MUTE FLUX';
      this.client && this.client.sendText('[OWNER NOTE] Quiet mode off. Resume normal balanced participation.');
      return;
    }
    AudioEngine.setMuted(!AudioEngine.muted);
    b.classList.toggle('on', AudioEngine.muted);
    b.textContent = AudioEngine.muted ? 'UNMUTE' : 'MUTE FLUX';
  },
  enterQuiet(){
    this.quiet = true; AudioEngine.setMuted(true);
    const b = $('#btnMute'); b.className = 'ctl mute quiet'; b.textContent = 'QUIET MODE';
    this.client && this.client.sendText('[OWNER NOTE] Quiet mode: stay completely silent until someone addresses you as Flux by name. Keep logging signals silently.');
    toast('Quiet mode — Flux stays silent until called by name. Tap again to release.');
  },

  async persist(){
    if (!this.active) return;
    const m = this.active;
    m.transcript = this.transcript.concat(this.curLine && this.curLine.text.trim() ? [this.curLine] : []);
    m.signals = this.signals; m.contacts = this.contacts;
    await dbPut('meetings', m).catch(()=>{});
  },

  async end(){
    const m = this.active; if (!m) return;
    clearInterval(this.timerIv); clearInterval(this.saveIv); clearTimeout(this._degTimer);
    this.flushLine();
    Ribbon.stop();
    this.client && this.client.close(); this.client = null;
    AudioEngine.onFrame = null;
    await AudioEngine.stop();
    m.endedAt = Date.now(); m.status = 'done';
    await this.persist(); this.active = null;
    /* harvest short Flux lines (greetings / quips) so they are never reused */
    addUsedLines(this.transcript.filter(l => l.who === 'flux' && l.text.trim().length < 170)
      .slice(0, 10).map(l => l.text.trim()));
    const cust = await dbGet('customers', m.customerId);
    if (cust) { cust.lastMeetingAt = Date.now(); await dbPut('customers', cust); }
    openSummary(m.id, true);
  }
};

/* ---------- ribbon animation ---------- */
const Ribbon = {
  raf: 0, cv: null, cx: null, t: 0,
  start(){ this.cv = $('#ribbon'); this.cx = this.cv.getContext('2d'); this.resize();
    window.addEventListener('resize', this._r = () => this.resize());
    cancelAnimationFrame(this.raf); const loop = () => { this.draw(); this.raf = requestAnimationFrame(loop); }; loop(); },
  stop(){ cancelAnimationFrame(this.raf); window.removeEventListener('resize', this._r); },
  resize(){ if (!this.cv) return; const z = $('#ribbonZone');
    this.cv.width = z.clientWidth * devicePixelRatio; this.cv.height = Math.max(40, z.clientHeight) * devicePixelRatio; },
  draw(){
    const cx = this.cx, W = this.cv.width, H = this.cv.height; if (!cx || !W) return;
    cx.clearRect(0, 0, W, H);
    this.t += 0.014;
    const level = Math.min(1, AudioEngine.micLevel * 6 + AudioEngine.fluxLevel * .9);
    const amp = H * (0.045 + level * 0.24);
    const mid = H / 2;
    const grad = cx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, '#2f9e8f'); grad.addColorStop(.5, '#d99a3d'); grad.addColorStop(1, '#b0523a');
    const wave = (phase, freq, a) => { cx.beginPath();
      for (let x = 0; x <= W; x += 6 * devicePixelRatio) {
        const n = Math.sin(x / W * freq * Math.PI * 2 + this.t * 2 + phase)
                + 0.5 * Math.sin(x / W * freq * 4.7 + this.t * 3.1 + phase * 2);
        const y = mid + n * a * (0.6 + 0.4 * Math.sin(x / W * Math.PI));
        x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
      } cx.strokeStyle = grad; cx.stroke(); };
    cx.lineWidth = 2.4 * devicePixelRatio; cx.setLineDash([7 * devicePixelRatio, 3 * devicePixelRatio]);
    cx.lineDashOffset = -this.t * 40 * devicePixelRatio; cx.globalAlpha = .95; wave(0, 2.2, amp);
    cx.setLineDash([]); cx.lineWidth = 1 * devicePixelRatio; cx.globalAlpha = .32; wave(1.4, 2.2, amp * .7);
    cx.globalAlpha = 1;
  }
};

async function generateSummary(){
  const m = sumMeeting; if (!m) return;
  const st = $('#sumStatus'); st.style.display = ''; st.textContent = 'Generating minutes…';
  const schema = { type:'OBJECT', properties:{
    customer_mom:{ type:'OBJECT', properties:{
      discussed:{ type:'ARRAY', items:{ type:'STRING' } },
      suggestions:{ type:'ARRAY', items:{ type:'OBJECT', properties:{
        item:{type:'STRING'}, why:{type:'STRING'}, data:{type:'STRING'} }, required:['item','why'] } },
      next_steps:{ type:'ARRAY', items:{ type:'STRING' } } }, required:['discussed','suggestions','next_steps'] },
    internal_debrief:{ type:'OBJECT', properties:{
      objections:{ type:'ARRAY', items:{ type:'STRING' } },
      buying_signals:{ type:'ARRAY', items:{ type:'STRING' } },
      price_sensitivity:{ type:'STRING' },
      followups:{ type:'ARRAY', items:{ type:'OBJECT', properties:{ what:{type:'STRING'}, when:{type:'STRING'} }, required:['what'] } } } },
    contacts:{ type:'ARRAY', items:{ type:'OBJECT', properties:{
      name:{type:'STRING'}, phone:{type:'STRING'}, email:{type:'STRING'}, company:{type:'STRING'} } } }
  }, required:['customer_mom','internal_debrief','contacts'] };

  const prompt = `You are preparing minutes for TOOLFLUX (carbide cutting tools, Hubli — same-day dispatch on stock, on-site support) after a sales meeting with "${m.customerName}".

TRANSCRIPT (ROOM = owner + customer voices mixed; FLUX = the AI partner):
${transcriptText(m) || '(transcript unavailable — recording only)'}

SIGNALS LOGGED LIVE: ${JSON.stringify(m.signals)}
CONTACTS CAPTURED LIVE: ${JSON.stringify(m.contacts)}
PRODUCTS PUSHED TODAY: ${JSON.stringify(m.pushIds)}

Produce JSON per the schema. Rules:
- customer_mom is CUSTOMER-SAFE: no internal reads, no hesitations analysis, no pricing strategy. English, crisp, professional. Every suggestion needs "why" (tied to what the customer said) and "data" (the concrete TOOLFLUX fact: grade/coating/range/dispatch). Only TOOLFLUX products.
- internal_debrief is PRIVATE and frank.
- contacts: merge captured + any mentioned in transcript; no inventions.
- If the transcript is thin, keep it honest and short — never fabricate.`;

  try {
    let txt;
    if (settings.apiKey) { /* prefer Gemini REST when a Gemini key exists */
      const callGemini = async model => {
        const r = await fetch(`https://${GEMINI_DEFAULTS.host}/v1beta/models/${model}:generateContent?key=${encodeURIComponent(settings.apiKey)}`, {
          method:'POST', headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ contents:[{ role:'user', parts:[{ text: prompt }] }],
            generationConfig:{ responseMimeType:'application/json', responseSchema: schema, temperature:.3 } }) });
        if (!r.ok) { const err = new Error('HTTP ' + r.status + ': ' + (await r.text()).slice(0, 180)); err.status = r.status; throw err; }
        const j = await r.json();
        return j.candidates && j.candidates[0] && j.candidates[0].content.parts.map(p => p.text || '').join('');
      };
      try { txt = await callGemini(settings.textModel); }
      catch (e) {
        if (e.status !== 404) throw e;
        /* model retired — find a live one on this key and remember it */
        st.textContent = 'That model was retired — finding a current one…';
        const d = await detectGeminiModels(settings.apiKey);
        const fallback = d.text || 'gemini-flash-latest';
        txt = await callGemini(fallback);
        settings.textModel = fallback; saveSettings();
        toast('Switched minutes model to ' + fallback, 'ok');
      }
    } else if (settings.openaiKey) { /* OpenAI-only: REST blocks browser CORS — use a text-mode Realtime session */
      txt = await openaiGenerateJSON(prompt + '\n\nReturn ONLY a JSON object exactly matching this schema (no markdown fences):\n' + JSON.stringify(toJsonSchema(schema)));
    } else throw new Error('no API key configured');
    txt = txt.trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
    m.summary = JSON.parse(txt);
    if (!m.summary.contacts || !m.summary.contacts.length) m.summary.contacts = m.contacts;
    await dbPut('meetings', m);
    st.style.display = 'none'; renderDocs(); toast('Minutes ready', 'ok');
  } catch (e) {
    st.textContent = 'Could not generate minutes: ' + e.message + ' — tap Regenerate to retry.';
    toast('Summary failed — ' + e.message, 'err');
  }
}

/* text-only generation over an OpenAI Realtime WS (no CORS restriction) */
function openaiGenerateJSON(prompt){
  return new Promise((resolve, reject) => {
    let out = ''; let settled = false;
    const done = (err, val) => { if (settled) return; settled = true; try { ws.close(); } catch {}
      err ? reject(err) : resolve(val); };
    let ws;
    try { ws = new WebSocket('wss://api.openai.com/v1/realtime?model=' + encodeURIComponent(settings.openaiModel),
      ['realtime', 'openai-insecure-api-key.' + settings.openaiKey, 'openai-beta.realtime-v1']); }
    catch (e) { return reject(e); }
    ws.onopen = () => ws.send(JSON.stringify({ type:'session.update', session:{
      modalities:['text'], instructions:'You are a precise assistant that outputs only valid JSON. No prose, no markdown.',
      turn_detection: null } }));
    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'session.updated') {
        ws.send(JSON.stringify({ type:'conversation.item.create', item:{ type:'message', role:'user', content:[{ type:'input_text', text: prompt }] } }));
        ws.send(JSON.stringify({ type:'response.create', response:{ modalities:['text'] } }));
      }
      if (m.type === 'response.text.delta' || m.type === 'response.output_text.delta') out += m.delta || '';
      if (m.type === 'response.done') done(null, out);
      if (m.type === 'error') done(new Error(m.error && m.error.message || 'openai error'));
    };
    ws.onerror = () => done(new Error('OpenAI websocket failed'));
    setTimeout(() => done(new Error('summary timed out')), 90000);
  });
}

async function stitchAudio(meetingId, mime){

  return new Blob(chunks.map(c => c.blob), { type: mime || 'audio/webm' });
}

    await dbDel('meetings', m.id);
  }
  toast('Cleared. Files downloaded.', 'ok'); renderHistory();
}

    ['id','name','family','spec1','spec2','spec3','spec4','spec5','spec6','pitch_line','promote'],
    ['ccmt-09t308-tpc35','CCMT 09T308 · TFX-TPC35','Inserts','Application: Steel finishing','Vc: 180–260 m/min','','','','','Finishing insert for steel.','yes']
  ]), 'Products');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['id','file','say_when_asked','caption'],
    ['udrill-demo','udrill-demo.mp4','u-drill demo, drilling video','HYPER-U Ø32 · 4140 steel · 3D']
  ]), 'Media');
  const out = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  dlBlob('library.xlsx', new Blob([out], { type:'application/octet-stream' }));
};

/* ================================================================
   RECOVERY + INIT + SELFTEST
   ================================================================ */
async function checkRecovery(){
  const live = (await dbAll('meetings')).filter(m => m.status === 'live');
  if (!live.length) return;
  const m = live.sort((a, b) => b.startedAt - a.startedAt)[0];
  sheet('Unfinished meeting found', `${m.customerName} · ${fmtDate(m.startedAt)} — the app closed mid-meeting. Everything up to that moment is saved.`,
    [['Close & summarise', 'primary', async () => { m.status = 'done'; m.endedAt = m.endedAt || Date.now();
        await dbPut('meetings', m); openSummary(m.id, true); }],
     ['Discard', 'danger', async () => { const chunks = await dbAll('chunks', 'meetingId', m.id);
        for (const c of chunks) await dbDel('chunks', c.id); await dbDel('meetings', m.id); toast('Discarded.'); }]]);
  /* mark any older strays done silently */
  for (const o of live.slice(1)) { o.status = 'done'; o.endedAt = o.endedAt || o.startedAt; await dbPut('meetings', o); }
}

async function selftest(){
  console.log('SELFTEST start');
  const o = { id:'st1', name:'x', nameLower:'x', createdAt:1 };
  await dbPut('customers', o); console.assert((await dbGet('customers','st1')).name === 'x', 'db get');
  await dbDel('customers','st1'); console.assert(!(await dbGet('customers','st1')), 'db del');
  if (!window.XLSX) await loadScript('pitch-assets/xlsx.min.js');
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['id','name','family','spec1','pitch_line','promote'], ['t1','Test Item','Inserts','A: b','line','yes']]), 'Products');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['id','file','say_when_asked','caption'], ['v1','v.mp4','demo video, the demo','cap']]), 'Media');
  const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  const wb2 = XLSX.read(buf, { type:'array' });
  const prods = XLSX.utils.sheet_to_json(wb2.Sheets['Products']);
  console.assert(prods.length === 1 && normalizeProduct(prods[0]).promote === true, 'xlsx roundtrip');
  Registry.media.set('v1', { id:'v1', file:'v.mp4', caption:'', aliases:['demo video','the demo'] });
  Registry.aliases.set('demo video','v1'); Registry.aliases.set('the demo','v1');
  console.assert(resolveMedia('play the demo').id === 'v1', 'media alias');
  Registry.media.delete('v1'); Registry.aliases.delete('demo video'); Registry.aliases.delete('the demo');
  console.assert(b64FromInt16(int16FromB64(b64FromInt16(new Int16Array([1,-2,300])))) === b64FromInt16(new Int16Array([1,-2,300])), 'b64 roundtrip');
  console.log('SELFTEST storage OK — all assertions passed');
  toast('Self-test passed — see console.', 'ok');
}

(async function init(){
  loadSettings();
  await openDB();
  await loadRegistry();
  if ('serviceWorker' in navigator && location.protocol !== 'file:')
    navigator.serviceWorker.register('pitch-sw.js').then(r => r.update()).catch(()=>{});
  fillSetup();
  if (!settings.apiKey) show('setup');
  else { renderHome(); show('home'); }
  checkRecovery();
  if (location.search.includes('selftest=1')) selftest();
})();
