<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOOLFLUX — Tool Life Register</title>
<meta name="description" content="Insert life tracking, shift production log and printable machine-side tool cards. TOOLFLUX Tool Life Register.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════
   TOOLFLUX TOOL LIFE REGISTER — digitized machine logbook
   Light, ruled, stamped. Reads like an engineering document.
   ════════════════════════════════════════════════════════════════════ */
:root {
  --teal: #0097B2;
  --teal-d: #004455;
  --navy: #012B42;
  --ink: #08141a;
  --T: #0d1e26;
  --mut: #64737c;
  --mut: oklch(0.55 0.02 230);
  --W: #FEFFFE;
  --off: #f4f7f8;
  --off2: #e8ecee;
  --rule: #e2e8eb;
  --teal-tint: #eaf6f8;
  --teal-tint: oklch(0.96 0.014 215);
  --warn: #ff6b1a;
  --warn-tint: #fff2e9;
  --warn-tint: oklch(0.96 0.024 55);
  --bad: #c0392b;
  --bad: oklch(0.55 0.18 29);
  --bad-tint: #fdeeec;
  --bad-tint: oklch(0.95 0.02 29);
  --ok: #1f8a66;
  --ok: oklch(0.58 0.1 165);
  --mono: ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
  --shadow-bar: 0 2px 24px rgba(0,0,0,.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--off);
  color: var(--T);
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: .85rem;
  line-height: 1.55;
  min-height: 100vh;
}
a { color: var(--teal); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: .85rem; color: var(--T); }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
::selection { background: var(--teal); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* ── stamped micro-label: the TOOLFLUX signature ── */
.lbl {
  font-size: .6rem; font-weight: 700; letter-spacing: .24em;
  text-transform: uppercase; color: var(--mut);
}
.lbl-teal { color: var(--teal); }

.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ════════ HEADER ════════ */
header.bar {
  position: sticky; top: 0; z-index: 600;
  background: rgba(254,255,254,.97);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--rule);
  box-shadow: var(--shadow-bar);
}
.bar-top {
  display: flex; align-items: center; gap: 1rem;
  padding: .7rem 1.5rem .55rem;
}
.bar-logo img { height: 26px; display: block; }
.bar-sep { width: 1px; height: 24px; background: var(--rule); }
.bar-app {
  font-size: .6rem; font-weight: 700; letter-spacing: .3em;
  text-transform: uppercase; color: var(--navy); white-space: nowrap;
}
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 1.1rem; }
.bar-xlink { font-size: .58rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); text-decoration: none; border: 1px solid var(--teal); padding: .2em .65em; border-radius: 99px; white-space: nowrap; transition: background .15s, color .15s; }
.bar-xlink:hover { background: var(--teal); color: #fff; }
.bar-clock { text-align: right; line-height: 1.25; }
.bar-clock .t { font-family: var(--mono); font-size: .92rem; font-weight: 600; color: var(--navy); }
.bar-clock .d { font-size: .58rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); }

/* tabs */
.tabs {
  display: flex; gap: 0; padding: 0 1rem;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; border: 0; background: none;
  padding: .6rem .9rem .55rem;
  font-size: .62rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--mut); white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color .15s;
}
.tab:hover { color: var(--teal-d); }
.tab[aria-selected="true"] { color: var(--teal-d); border-bottom-color: var(--teal); }
.tab .tag {
  display: inline-block; min-width: 1.15rem; padding: 0 .25rem; margin-left: .35rem;
  font-family: var(--mono); font-size: .6rem; line-height: 1.5;
  background: var(--bad); color: #fff; border-radius: 2px; letter-spacing: 0;
}

/* ════════ LAYOUT ════════ */
main { max-width: 1280px; margin: 0 auto; padding: 1.4rem 1.5rem 5rem; }
.panel {
  background: var(--W); border: 1px solid var(--rule); border-radius: 2px;
  margin-bottom: 1.4rem;
}
.panel-hd {
  display: flex; align-items: baseline; gap: .9rem; flex-wrap: wrap;
  padding: .8rem 1.1rem .7rem; border-bottom: 1px solid var(--rule);
}
.panel-hd .lbl { flex-shrink: 0; }
.panel-hd .rule { flex: 1; height: 1px; background: var(--rule); align-self: center; min-width: 2rem; }
.panel-bd { padding: 1rem 1.1rem; }
.muted { color: var(--mut); }
.small { font-size: .72rem; }

/* ════════ BUTTONS ════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  border: 1px solid transparent; border-radius: 2px;
  padding: .62rem 1.15rem;
  font-size: .62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  transition: background .15s, color .15s, border-color .15s;
  min-height: 38px;
}
.btn-pri { background: var(--teal); color: #fff; }
.btn-pri:hover { background: var(--teal-d); }
.btn-ink { background: var(--navy); color: #fff; }
.btn-ink:hover { background: var(--ink); }
.btn-ol { background: var(--W); color: var(--navy); border-color: var(--navy); }
.btn-ol:hover { background: var(--navy); color: #fff; }
.btn-ghost { background: none; color: var(--mut); border-color: var(--rule); }
.btn-ghost:hover { color: var(--teal-d); border-color: var(--teal); }
.btn-bad { background: var(--W); color: var(--bad); border-color: var(--bad); }
.btn-bad:hover { background: var(--bad); color: #fff; }
.btn-big { min-height: 48px; padding: .8rem 1.4rem; font-size: .68rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 13px; height: 13px; flex-shrink: 0; }

/* ════════ FORMS ════════ */
.fgrid { display: grid; gap: .9rem 1rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.field label, .field .flabel {
  display: block; margin-bottom: .3rem;
  font-size: .58rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--mut);
}
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--rule); border-radius: 2px;
  background: var(--W); padding: .55rem .6rem; min-height: 40px;
}
.field textarea { min-height: 64px; resize: vertical; }
.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--teal); }
.field .hint { margin-top: .3rem; font-size: .68rem; color: var(--mut); }
.field .hint.good { color: var(--ok); }
.check { display: flex; align-items: center; gap: .55rem; font-size: .78rem; cursor: pointer; user-select: none; }
.check input { width: 17px; height: 17px; accent-color: var(--teal); cursor: pointer; }

/* qty stepper */
.stepper { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
.stepper input {
  width: 110px; min-height: 48px; text-align: center;
  font-family: var(--mono); font-size: 1.25rem; font-weight: 600;
  border: 1px solid var(--rule); border-radius: 2px;
}
.stepper button {
  min-width: 52px; min-height: 48px; border: 1px solid var(--rule); border-radius: 2px;
  background: var(--off); font-family: var(--mono); font-size: .85rem; font-weight: 600; color: var(--navy);
  transition: background .15s, border-color .15s;
}
.stepper button:hover { background: var(--teal-tint); border-color: var(--teal); }

/* ════════ OPERATOR STRIP ════════ */
.opstrip { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .85rem 1.1rem; }
.opchip {
  border: 1px solid var(--rule); border-radius: 2px; background: var(--W);
  padding: .5rem .9rem; min-height: 42px;
  font-size: .74rem; font-weight: 600; color: var(--T);
  transition: border-color .15s, background .15s;
}
.opchip:hover { border-color: var(--teal); }
.opchip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

/* ════════ MACHINE LEDGER (floor) ════════ */
.mach-hd {
  display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
  padding: .85rem 1.1rem .75rem; border-bottom: 1px solid var(--rule);
  background: var(--off);
}
.mach-code { font-size: 1.05rem; font-weight: 800; letter-spacing: .02em; color: var(--navy); }
.mach-name { font-size: .78rem; color: var(--mut); }
.mach-type {
  font-size: .56rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  border: 1px solid var(--rule); border-radius: 2px; padding: .15rem .45rem; color: var(--mut); background: var(--W);
}
.mach-today { margin-left: auto; font-size: .72rem; color: var(--mut); }
.mach-today b { font-family: var(--mono); font-size: .95rem; color: var(--navy); }

.trow {
  display: grid; gap: .5rem 1.1rem; align-items: center;
  grid-template-columns: 64px minmax(150px,1.4fr) minmax(140px,1.2fr) minmax(170px,1.5fr) auto;
  padding: .85rem 1.1rem;
  border-bottom: 1px solid var(--rule);
}
.trow:last-child { border-bottom: 0; }
.trow.warn { background: var(--warn-tint); }
.trow.over { background: var(--bad-tint); }
.t-station { font-family: var(--mono); font-size: .95rem; font-weight: 700; color: var(--navy); }
.t-op { font-size: .68rem; color: var(--mut); }
.t-spec { display: flex; align-items: center; gap: .7rem; }
.t-spec .glyph { flex-shrink: 0; }
.t-ins { font-family: var(--mono); font-size: .88rem; font-weight: 600; color: var(--T); }
.t-grade { font-size: .68rem; color: var(--mut); }
.t-edge .e { font-size: .78rem; font-weight: 700; color: var(--navy); }
.t-edge .side { font-size: .62rem; font-weight: 700; letter-spacing: .1em; color: var(--warn); margin-left: .3rem; }
.t-since { font-size: .66rem; color: var(--mut); }
.t-life { min-width: 150px; }
.lifebar { position: relative; height: 7px; background: var(--off2); border-radius: 1px; overflow: hidden; margin: .25rem 0 .2rem; }
.lifebar i { position: absolute; inset: 0 auto 0 0; background: var(--ok); transition: width .2s; }
.lifebar.w i { background: var(--warn); }
.lifebar.o i { background: var(--bad); }
.life-top { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; }
.life-count { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; color: var(--T); }
.life-count small { font-size: .68rem; font-weight: 400; color: var(--mut); }
.life-pct { font-family: var(--mono); font-size: .72rem; color: var(--mut); }
.life-pct.w { color: var(--warn); font-weight: 700; }
.life-pct.o { color: var(--bad); font-weight: 700; }
.t-act { display: flex; gap: .45rem; flex-wrap: wrap; justify-content: flex-end; }
.t-act .btn { padding: .55rem .8rem; }

/* inline action drawer */
.drawer {
  grid-column: 1 / -1;
  border: 1px solid var(--teal); border-radius: 2px; background: var(--teal-tint);
  padding: 1rem 1.1rem; margin-top: .35rem;
}
.drawer.warn-d { border-color: var(--warn); background: var(--warn-tint); }
.drawer-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .8rem; }
.drawer-acts { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .9rem; }
.kv { font-size: .74rem; color: var(--mut); }
.kv b { color: var(--T); font-family: var(--mono); }

/* insert glyph */
.glyph svg { display: block; }
.glyph .gshape { fill: var(--W); stroke: var(--navy); stroke-width: 3; }
.glyph .gc-done { fill: var(--off2); stroke: var(--mut); }
.glyph .gc-cur { fill: var(--teal); stroke: var(--teal-d); }
.glyph .gc-next { fill: var(--W); stroke: var(--mut); }
.glyph text { font-family: var(--mono); font-weight: 700; }

/* ════════ TABLES (log, dash) ════════ */
.tblwrap { overflow-x: auto; }
table.reg { width: 100%; border-collapse: collapse; }
.reg th {
  font-size: .56rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--mut); text-align: left; padding: .55rem .65rem;
  border-bottom: 1px solid var(--navy); white-space: nowrap;
}
.reg td { padding: .55rem .65rem; border-bottom: 1px solid var(--rule); font-size: .78rem; vertical-align: top; }
.reg td.n, .reg th.n { text-align: right; font-variant-numeric: tabular-nums; }
.reg td.mono { font-size: .74rem; }
.reg tr.sub td { background: var(--off); font-weight: 600; border-bottom: 1px solid var(--rule); }
.reg tr.tot td { background: var(--navy); color: #fff; font-weight: 600; border-bottom: 0; }
.reg tr.tot td .lbl { color: rgba(255,255,255,.7); }
.reg .del { background: none; border: 0; color: var(--mut); font-size: .9rem; padding: .1rem .35rem; border-radius: 2px; }
.reg .del:hover { color: var(--bad); background: var(--bad-tint); }
.rowlink { cursor: pointer; }
.rowlink:hover td { background: var(--teal-tint); }

/* filter chips */
.chips { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
.chip {
  border: 1px solid var(--rule); border-radius: 2px; background: var(--W);
  padding: .4rem .75rem; font-size: .64rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--mut); transition: all .15s; min-height: 34px;
}
.chip:hover { border-color: var(--teal); color: var(--teal-d); }
.chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }

/* ════════ DASHBOARD ════════ */
.statband { display: flex; flex-wrap: wrap; }
.stat {
  flex: 1 1 150px; padding: 1rem 1.1rem .9rem;
  border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.stat:last-child { border-right: 0; }
.stat .v { font-family: var(--mono); font-size: 1.9rem; font-weight: 700; line-height: 1.1; color: var(--navy); }
.stat .v .u { font-size: .8rem; font-weight: 400; color: var(--mut); }
.stat .v.warn-c { color: var(--warn); }
.stat .v.bad-c { color: var(--bad); }
.stat .sub { font-size: .66rem; color: var(--mut); margin-top: .15rem; }
.delta-up { color: var(--ok); }
.delta-dn { color: var(--bad); }

/* attention list */
.attn { display: flex; flex-direction: column; }
.attn-row {
  display: grid; grid-template-columns: auto 1fr auto; gap: .35rem 1rem; align-items: center;
  padding: .7rem 1.1rem; border-bottom: 1px solid var(--rule);
}
.attn-row:last-child { border-bottom: 0; }
.attn-flag { font-size: .58rem; font-weight: 800; letter-spacing: .16em; padding: .25rem .5rem; border-radius: 2px; }
.attn-flag.w { background: var(--warn-tint); color: var(--warn); border: 1px solid var(--warn); }
.attn-flag.o { background: var(--bad-tint); color: var(--bad); border: 1px solid var(--bad); }

/* chart */
.chart-wrap { overflow-x: auto; padding: .4rem 0 0; }
.chart-legend { display: flex; gap: 1.1rem; flex-wrap: wrap; padding: .6rem 0 0; }
.chart-legend .li { display: flex; align-items: center; gap: .4rem; font-size: .66rem; color: var(--mut); }
.chart-legend .sw { width: 10px; height: 10px; border-radius: 1px; }

/* timeline */
.tl { list-style: none; }
.tl li {
  display: grid; grid-template-columns: 132px auto 1fr; gap: .9rem; align-items: baseline;
  padding: .5rem 1.1rem; border-bottom: 1px solid var(--rule);
}
.tl li:last-child { border-bottom: 0; }
.tl .ts { font-family: var(--mono); font-size: .68rem; color: var(--mut); white-space: nowrap; }
.tl .tag {
  font-size: .54rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  padding: .18rem .45rem; border-radius: 2px; white-space: nowrap;
}
.tag-new { background: var(--teal-tint); color: var(--teal-d); border: 1px solid var(--teal); }
.tag-rotate { background: var(--off); color: var(--navy); border: 1px solid var(--navy); }
.tag-count { background: var(--off); color: var(--mut); border: 1px solid var(--rule); }
.tag-shift { background: var(--navy); color: #fff; border: 1px solid var(--navy); }
.tl .what { font-size: .76rem; }
.tl .who { color: var(--mut); }

/* ════════ PIN PAD ════════ */
.pinwrap { max-width: 320px; margin: 3rem auto; text-align: center; }
.pindots { display: flex; gap: .7rem; justify-content: center; margin: 1.2rem 0 1.5rem; }
.pindots i { width: 14px; height: 14px; border: 1px solid var(--navy); border-radius: 50%; }
.pindots i.f { background: var(--navy); }
.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.pinpad button {
  min-height: 58px; border: 1px solid var(--rule); border-radius: 2px; background: var(--W);
  font-family: var(--mono); font-size: 1.2rem; font-weight: 600; color: var(--navy);
  transition: background .15s, border-color .15s;
}
.pinpad button:hover { border-color: var(--teal); background: var(--teal-tint); }
.pin-err { color: var(--bad); font-size: .74rem; margin-top: .9rem; min-height: 1.2em; }

/* ════════ EMPTY / ONBOARD ════════ */
.onboard { text-align: center; padding: 3.2rem 1.5rem; }
.onboard h2 { font-size: 1.25rem; font-weight: 800; color: var(--navy); letter-spacing: -.01em; margin: .9rem 0 .4rem; }
.onboard p { color: var(--mut); max-width: 46ch; margin: 0 auto .4rem; }
.onboard .steps {
  display: flex; gap: 0; justify-content: center; flex-wrap: wrap;
  margin: 1.6rem auto 1.8rem; max-width: 720px; text-align: left;
}
.onboard .step { flex: 1 1 200px; padding: 1rem 1.2rem; border-left: 1px solid var(--rule); }
.onboard .step:first-child { border-left: 0; }
.onboard .step b { display: block; font-size: .8rem; color: var(--navy); margin: .35rem 0 .2rem; }
.onboard .step span { font-size: .74rem; color: var(--mut); }
.onboard .n { font-family: var(--mono); font-size: .7rem; font-weight: 700; color: var(--teal); }
.onboard .acts { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
.empty { text-align: center; padding: 2rem 1rem; color: var(--mut); font-size: .78rem; }

/* ════════ SETTINGS ════════ */
.setrow {
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: .7rem 1.1rem; border-bottom: 1px solid var(--rule);
}
.setrow:last-child { border-bottom: 0; }
.setrow .grow { flex: 1; min-width: 140px; }
.setrow .mini { background: none; border: 0; color: var(--mut); font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .5rem; border-radius: 2px; }
.setrow .mini:hover { color: var(--teal-d); background: var(--teal-tint); }
.setrow .mini.danger:hover { color: var(--bad); background: var(--bad-tint); }
.inactive-row { opacity: .5; }

/* ════════ TOASTS ════════ */
#toasts { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); z-index: 900; display: flex; flex-direction: column; gap: .5rem; align-items: center; pointer-events: none; }
.toast {
  background: var(--navy); color: #fff; border-radius: 2px;
  padding: .65rem 1.1rem; font-size: .74rem; font-weight: 500;
  box-shadow: 0 8px 30px rgba(0,0,0,.18);
  animation: toastin .18s ease-out;
  max-width: min(92vw, 480px);
}
.toast .mono { color: var(--teal); }
.toast.bad-t { background: var(--bad); }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ════════ PRINT SHEET (A4) ════════ */
.sheet-tools { display: flex; gap: .8rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1.2rem; }
.sheet {
  background: #fff; color: #111;
  width: min(100%, 210mm); margin: 0 auto;
  padding: 11mm 12mm;
  border: 1px solid var(--rule);
  box-shadow: 0 10px 36px rgba(0,0,0,.1);
  font-size: 9.2pt; line-height: 1.4;
}
.sheet * { color: #111; }
.sh-hd { display: flex; align-items: center; gap: 5mm; border-bottom: 2.5px solid #111; padding-bottom: 3.5mm; }
.sh-hd img { height: 9mm; display: block; }
.sh-title { margin-left: auto; text-align: right; }
