<!DOCTYPE html>
<html lang="en" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOOLFLUX — Machining Log</title>
<style>
/* ═══════════════════════════════════════════════
   TOOLFLUX MACHINING LOG v3
   Component-centric. Insert-lifecycle aware.
   Engineering ledger. Light only.
   ═══════════════════════════════════════════════ */
:root {
  --teal:    #0097B2;
  --teal-d:  #00748a;
  --navy:    #012B42;
  --ink:     #08141a;
  --T:       #0d1e26;
  --mut:     #5a7282;
  --W:       #FEFFFE;
  --off:     #f2f5f7;
  --off2:    #e4eaed;
  --rule:    #ccd4d8;
  --rule2:   #a8b6bc;
  --teal-tint: #e5f4f7;
  --warn:    #b06000;
  --warn-bg: #fff3e0;
  --bad:     #a62d1e;
  --bad-bg:  #fdf0ee;
  --ok:      #1a6e50;
  --ok-bg:   #eaf4ef;
  --mono: ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
  --r: 1px;
  --sh: 0 1px 6px rgba(0,0,0,.09);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0 }
html { -webkit-text-size-adjust: 100% }
body {
  background: var(--off);
  color: var(--T);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: .875rem;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--teal); text-decoration: none }
button { font-family: inherit; cursor: pointer }
input, select, textarea { font-family: inherit; font-size: .875rem; color: var(--T); background: var(--W) }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px }
::selection { background: var(--teal); color: #fff }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition-duration: .01ms !important } }

/* ─── util ─── */
.lbl { font-size: .58rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--mut) }
.lbl-t { color: var(--teal) }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.num  { font-variant-numeric: tabular-nums }
.muted { color: var(--mut) }
.small { font-size: .75rem }
.req { color: var(--bad) }

/* ─── header ─── */
header.bar {
  position: sticky; top: 0; z-index: 600;
  background: var(--W);
  border-bottom: 2px solid var(--navy);
  box-shadow: var(--sh);
}
.bar-top {
  display: flex; align-items: center; gap: .9rem;
  padding: .6rem 1.4rem .5rem;
}
.bar-logo img { height: 24px; display: block }
.bar-sep { width: 1px; height: 20px; background: var(--rule2); flex-shrink: 0 }
.bar-app {
  font-size: .58rem; font-weight: 800; letter-spacing: .3em;
  text-transform: uppercase; color: var(--navy); white-space: nowrap;
}
.bar-crumb {
  font-family: var(--mono);
  font-size: .72rem; font-weight: 700;
  color: var(--teal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar-right { margin-left: auto; display: flex; align-items: center; gap: .65rem }
.bar-clock { text-align: right; line-height: 1.2 }
.bar-clock .t { font-family: var(--mono); font-size: .88rem; font-weight: 600; color: var(--navy) }
.bar-clock .d { font-size: .57rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mut) }
.crumb-back {
  font-size: .6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--mut); border: 1px solid var(--rule2); border-radius: var(--r);
  background: none; padding: .3rem .6rem; min-height: 30px; transition: all .15s;
}
.crumb-back:hover { color: var(--navy); border-color: var(--navy) }
.tabs { display: flex; padding: 0 1.2rem; gap: 0; overflow-x: auto; scrollbar-width: none }
.tabs::-webkit-scrollbar { display: none }
.tab {
  appearance: none; border: 0; background: none;
  padding: .52rem .82rem .48rem;
  font-size: .6rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
  color: var(--mut); white-space: nowrap;
  border-bottom: 2px solid transparent; transition: color .15s;
}
.tab:hover { color: var(--navy) }
.tab[aria-selected=true] { color: var(--navy); border-bottom-color: var(--teal) }
.tab .n {
  display: inline-block; min-width: 1.1rem; padding: 0 .2rem; margin-left: .28rem;
  font-family: var(--mono); font-size: .56rem; line-height: 1.55;
  background: var(--teal); color: #fff; border-radius: 1px; letter-spacing: 0;
}

/* ─── layout ─── */
main { max-width: 1280px; margin: 0 auto; padding: 1.2rem 1.4rem 6rem }
.panel { background: var(--W); border: 1px solid var(--rule); border-radius: var(--r); margin-bottom: 1.1rem; overflow: hidden }
.panel-hd {
  display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
  padding: .65rem 1rem .55rem;
  border-bottom: 1px solid var(--rule);
  background: var(--off);
}
.panel-hd .hr { flex: 1; height: 1px; background: var(--rule) }
.panel-bd { padding: .85rem 1rem }

/* ─── buttons ─── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
  border: 1px solid transparent; border-radius: var(--r);
  padding: .55rem 1rem;
  font-size: .6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  transition: background .14s, color .14s, border-color .14s;
  min-height: 36px; white-space: nowrap;
}
.btn-pri  { background: var(--navy); color: #fff; border-color: var(--navy) }
.btn-pri:hover  { background: var(--teal-d); border-color: var(--teal-d) }
.btn-teal { background: var(--teal); color: #fff; border-color: var(--teal) }
.btn-teal:hover { background: var(--teal-d); border-color: var(--teal-d) }
.btn-ol   { background: var(--W); color: var(--navy); border-color: var(--navy) }
.btn-ol:hover   { background: var(--navy); color: #fff }
.btn-ghost { background: none; color: var(--mut); border-color: var(--rule2) }
.btn-ghost:hover { color: var(--navy); border-color: var(--navy) }
.btn-bad  { background: var(--W); color: var(--bad); border-color: var(--bad) }
.btn-bad:hover  { background: var(--bad); color: #fff }
.btn-ok   { background: var(--ok); color: #fff; border-color: var(--ok) }
.btn-ok:hover   { filter: brightness(1.1) }
.btn-lg   { min-height: 46px; padding: .7rem 1.3rem; font-size: .64rem }
.btn:disabled { opacity: .38; cursor: not-allowed }

/* ─── forms ─── */
.fgrid { display: grid; gap: .8rem .9rem; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)) }
.field label, .field .flbl {
  display: block; margin-bottom: .25rem;
  font-size: .57rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--mut);
}
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--rule2); border-radius: var(--r);
  padding: .5rem .58rem; min-height: 38px;
  background: var(--W); color: var(--T); transition: border-color .14s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); outline: none }
.field textarea { min-height: 64px; resize: vertical }
.hint { margin-top: .22rem; font-size: .67rem; color: var(--mut) }

/* ─── job hero ─── */
.job-hero {
  background: var(--navy); color: var(--W);
  padding: 1.2rem 1.4rem 1rem;
  border-bottom: 2px solid var(--teal);
}
.hero-top { display: flex; align-items: flex-start; gap: 1.5rem; flex-wrap: wrap }
.hero-main { flex: 1; min-width: 180px }
.hero-code {
  font-family: var(--mono);
  font-size: 1.55rem; font-weight: 700; letter-spacing: .06em;
  color: #fff; line-height: 1;
}
.hero-desc { font-size: .78rem; color: rgba(255,255,255,.65); margin-top: .3rem }
.hero-meta { font-size: .62rem; color: rgba(255,255,255,.45); margin-top: .18rem; letter-spacing: .04em }
.hero-count-wrap { text-align: right; flex-shrink: 0 }
.hero-num {
  font-family: var(--mono); font-size: 3.2rem; font-weight: 700;
  color: #fff; line-height: 1; font-variant-numeric: tabular-nums;
}
.hero-num-lbl { font-size: .58rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-top: .25rem }
.hero-acts { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: .85rem }
.hero-acts .btn-teal { background: var(--teal); color: #fff }
.hero-acts .btn-ghost { color: rgba(255,255,255,.6); border-color: rgba(255,255,255,.25) }
.hero-acts .btn-ghost:hover { color: #fff; border-color: #fff }

/* ─── station strip ─── */
.station-scroll { overflow-x: auto; padding: .85rem 1rem .9rem; display: flex; gap: .65rem; scrollbar-width: thin }
.station-scroll::-webkit-scrollbar { height: 4px }
.station-scroll::-webkit-scrollbar-thumb { background: var(--rule2); border-radius: 2px }
.station-tile {
  flex-shrink: 0; width: 158px;
  border: 1.5px solid var(--rule2);
  border-radius: var(--r);
  background: var(--W);
  padding: .6rem .7rem .55rem;
  cursor: pointer; transition: border-color .14s, box-shadow .14s;
  position: relative;
}
.station-tile:hover { border-color: var(--teal); box-shadow: 0 2px 8px rgba(0,151,178,.12) }
.station-tile.warn-st { border-color: var(--warn); }
.station-tile.bad-st  { border-color: var(--bad); }
.st-type {
  font-size: .52rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  padding: .15rem .4rem; border-radius: var(--r); border: 1px solid;
  display: inline-block; margin-bottom: .4rem;
}
.st-name { font-size: .78rem; font-weight: 700; color: var(--navy); line-height: 1.25; margin-bottom: .1rem }
.st-sub  { font-size: .62rem; color: var(--mut); font-family: var(--mono); margin-bottom: .42rem }
.pip-row { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: .4rem }
.pip { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; transition: background .14s }
.pip.done    { background: var(--navy) }
.pip.current { background: var(--teal) }
.pip.broken  { background: var(--bad) }
.pip.empty   { background: transparent; border: 1.5px solid var(--rule2) }
.st-corner-lbl { font-size: .64rem; font-weight: 600; color: var(--navy); font-family: var(--mono) }
.st-corner-sub { font-size: .6rem; color: var(--mut) }
.no-insert-lbl { font-size: .66rem; color: var(--mut); font-style: italic; padding: .3rem 0 }
.add-tile {
  flex-shrink: 0; width: 100px;
  border: 1.5px dashed var(--rule2);
  border-radius: var(--r);
  background: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .35rem; cursor: pointer; transition: border-color .14s, color .14s;
  color: var(--mut); font-size: .6rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  padding: .6rem;
}
.add-tile:hover { border-color: var(--teal); color: var(--teal) }
.add-tile .plus { font-size: 1.4rem; font-weight: 300; line-height: 1 }

/* ─── log production form ─── */
.log-form-wrap {
  background: var(--teal-tint);
  border: 1.5px solid var(--teal);
  border-radius: var(--r);
  margin-bottom: 1.1rem;
  overflow: hidden;
}
.log-form-hd {
  padding: .65rem 1rem .55rem;
  background: var(--teal);
  display: flex; align-items: center; gap: .8rem;
}
.log-form-hd .lbl { color: rgba(255,255,255,.75) }
.log-form-hd .title { font-size: .75rem; font-weight: 700; color: #fff }
.log-form-bd { padding: .9rem 1rem 1rem }
.qty-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .9rem }
.qty-inp {
  font-family: var(--mono);
  font-size: 2rem; font-weight: 700;
  width: 130px; min-height: 56px;
  border: 2px solid var(--navy); border-radius: var(--r);
  padding: .3rem .6rem; text-align: center; color: var(--navy);
}
.qty-inp:focus { border-color: var(--teal); outline: none }
.qty-adj {
  border: 1px solid var(--rule2); border-radius: var(--r);
  background: var(--W); color: var(--navy);
  font-size: .68rem; font-weight: 700;
  padding: .3rem .55rem; min-height: 34px;
  transition: all .12s;
}
.qty-adj:hover { background: var(--navy); color: #fff; border-color: var(--navy) }
.ev-station-list { display: flex; flex-direction: column; gap: .45rem; margin: .75rem 0 }
.ev-station-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: .45rem .7rem; align-items: center;
  padding: .5rem .65rem;
  background: var(--W); border: 1px solid var(--rule); border-radius: var(--r);
}
.ev-st-name { font-size: .75rem; font-weight: 700; color: var(--navy); line-height: 1.2 }
.ev-st-sub  { font-size: .62rem; color: var(--mut); grid-column: 1 }

/* ─── production log table ─── */
.log-tbl-wrap { overflow-x: auto }
.log-tbl {
  width: 100%; border-collapse: collapse;
  font-size: .78rem;
}
.log-tbl th {
  font-size: .57rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--mut); text-align: left;
  padding: .45rem .75rem;
  background: var(--off); border-bottom: 1.5px solid var(--rule2);
  white-space: nowrap;
}
.log-tbl td {
  padding: .55rem .75rem;
  border-bottom: 1px solid var(--rule);
  font-variant-numeric: tabular-nums; vertical-align: top;
}
.log-tbl tr:last-child td { border-bottom: 0 }
.log-tbl .qty-cell { font-family: var(--mono); font-size: .9rem; font-weight: 700; color: var(--navy) }
.log-tbl .ts-cell  { font-family: var(--mono); font-size: .72rem; color: var(--mut); white-space: nowrap }
.ev-chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .22rem }
.ev-chip {
  font-size: .55rem; font-weight: 700; letter-spacing: .06em;
  padding: .1rem .38rem; border-radius: 1px;
}
.ev-chip.index   { background: var(--teal-tint); color: var(--teal-d); border: 1px solid var(--teal) }
.ev-chip.replace { background: var(--off2); color: var(--navy); border: 1px solid var(--rule2) }
.ev-chip.broken  { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad) }

/* ─── station detail ─── */
.set-block {
  border: 1px solid var(--rule);
  border-radius: var(--r);
  margin-bottom: .75rem;
  overflow: hidden;
}
.set-hd {
  display: flex; align-items: center; gap: .8rem;
  padding: .55rem .85rem .5rem;
  background: var(--off); border-bottom: 1px solid var(--rule);
}
.set-badge {
  font-family: var(--mono); font-size: .66rem; font-weight: 700;
  background: var(--navy); color: #fff;
  padding: .18rem .5rem; border-radius: var(--r);
}
.set-badge.spent  { background: var(--ok) }
.set-badge.broken { background: var(--bad) }
.set-badge.active { background: var(--teal) }
.corner-tbl { width: 100%; border-collapse: collapse; font-size: .78rem }
.corner-tbl th {
  font-size: .55rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--mut); text-align: left; padding: .4rem .75rem;
  background: var(--off); border-bottom: 1px solid var(--rule);
}
.corner-tbl td { padding: .5rem .75rem; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums }
.corner-tbl tr:last-child td { border-bottom: 0 }
.corner-tbl .active-row { background: oklch(0.97 0.008 215) }
.corner-tbl .broken-row { background: var(--bad-bg) }

/* ─── jobs list ─── */
.jobs-hd { display: flex; align-items: baseline; gap: 1rem; margin-bottom: .85rem }
.jobs-hd h2 { font-size: 1.05rem; font-weight: 800; color: var(--navy) }
.job-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: .5rem 1.2rem;
  align-items: start;
  padding: .8rem 1rem;
  border-bottom: 1px solid var(--rule);
  cursor: pointer; transition: background .13s;
}
.job-row:last-child { border-bottom: 0 }
.job-row:hover { background: var(--off) }
.job-code { font-family: var(--mono); font-size: .9rem; font-weight: 700; color: var(--navy) }
.job-desc { font-size: .73rem; color: var(--mut); margin-top: .1rem }
.job-meta { font-size: .63rem; color: var(--mut); margin-top: .22rem }
.job-count { font-family: var(--mono); font-size: 1.25rem; font-weight: 700; color: var(--navy); text-align: right }
.job-count-lbl { font-size: .56rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--mut); text-align: right }
.job-health { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .35rem }
.health-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok) }
.health-dot.warn { background: var(--warn) }
.health-dot.bad  { background: var(--bad) }
.health-dot.empty { background: transparent; border: 1.5px solid var(--rule2) }
.job-status-badge {
  display: inline-block;
  font-size: .52rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  padding: .15rem .42rem; border-radius: var(--r); border: 1px solid;
  margin-left: .5rem;
}
.job-status-badge.active   { background: var(--ok-bg);   color: var(--ok);   border-color: var(--ok) }
.job-status-badge.paused   { background: var(--warn-bg);  color: var(--warn);  border-color: var(--warn) }
.job-status-badge.complete { background: var(--off2);     color: var(--mut);   border-color: var(--rule2) }

/* ─── op type badges ─── */
.badge-op {
  font-size: .52rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  padding: .15rem .4rem; border-radius: var(--r); border: 1px solid;
  white-space: nowrap;
}
.op-turn  { background: #e8f3fa; color: #0a3a5c; border-color: #7ab0cc }
.op-mill  { background: #eef7ee; color: #0d4a1a; border-color: #7ab87a }
.op-drill { background: #fff3e5; color: #6b3400; border-color: #d4813a }
.op-tap   { background: #f5eef8; color: #4a1570; border-color: #a97dc0 }
.op-bore  { background: #fef7e5; color: #5a3800; border-color: #c8a83a }
.op-ream  { background: #f0fafa; color: #005e6e; border-color: #3ab0c0 }
.op-other { background: var(--off2); color: var(--mut); border-color: var(--rule2) }

/* ─── stat strip ─── */
.stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); border-top: 1px solid var(--rule) }
.s-stat { padding: .75rem 1rem .65rem; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule) }
.s-stat:last-child { border-right: 0 }
.s-val { font-family: var(--mono); font-size: 1.55rem; font-weight: 700; color: var(--navy); line-height: 1 }
.s-val.ok-c  { color: var(--ok) }
.s-val.warn-c { color: var(--warn) }
.s-val.bad-c  { color: var(--bad) }
.s-sub { font-size: .63rem; color: var(--mut); margin-top: .15rem }
.s-unit { font-size: .65rem; font-weight: 400; color: var(--mut) }

/* ─── toasts ─── */
#toasts {
  position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
  z-index: 900; display: flex; flex-direction: column; gap: .45rem;
  align-items: center; pointer-events: none;
}
.toast {
  background: var(--navy); color: #fff;
  border-radius: var(--r); padding: .6rem 1rem;
  font-size: .74rem; font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  animation: tin .16s ease-out;
  max-width: min(92vw, 460px);
}
.toast.ok-t  { background: var(--ok) }
.toast.bad-t { background: var(--bad) }
@keyframes tin { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* ─── anomaly flag ─── */
.anomaly-flag {
  display: flex; gap: .55rem; align-items: flex-start;
  padding: .55rem .75rem;
  background: var(--bad-bg); border: 1px solid var(--bad);
  border-radius: var(--r); font-size: .73rem;
  margin-bottom: .45rem;
}
.anomaly-flag .ic { color: var(--bad); font-size: .85rem; flex-shrink: 0; margin-top: .05rem }
.anomaly-flag .msg { color: var(--bad); font-weight: 500 }
.anomaly-flag .detail { color: var(--mut); font-size: .67rem; margin-top: .1rem }

/* ─── report ─── */
#print-area { display: none }
.report {
  background: #fff; color: #111;
  width: min(100%, 210mm); margin: 0 auto;
  padding: 10mm 11mm; font-size: 9pt; line-height: 1.4;
  border: 1px solid var(--rule); box-shadow: 0 4px 24px rgba(0,0,0,.08);
}
.report * { color: #111 !important; background: #fff !important; box-shadow: none !important }
.rpt-hd { display: flex; align-items: flex-start; gap: 5mm; border-bottom: 2.5px solid #111; padding-bottom: 3mm; margin-bottom: 3.5mm }
.rpt-hd img { height: 8mm; display: block }
.rpt-hd-info { flex: 1 }
.rpt-hd-info .co { font-size: 13pt; font-weight: 800 }
.rpt-hd-info .meta { font-size: 7pt; color: #444; margin-top: .8mm }
.rpt-hd-right { text-align: right }
.rpt-hd-right .title { font-size: 10pt; font-weight: 800; letter-spacing: .06em; text-transform: uppercase }

<body>
<div id="app">
  <header class="bar">
    <div class="bar-top">
      <a class="bar-logo" href="index.html" title="TOOLFLUX"><img src="assets/toolflux-logo.svg" alt="TOOLFLUX"></a>
      <span class="bar-sep" aria-hidden="true"></span>
      <span class="bar-app">Machining Log</span>
      <span id="bar-crumb" class="bar-crumb" style="display:none"></span>
      <div class="bar-right">
        <div class="bar-clock" aria-hidden="true">
          <div class="t" id="clock-t"></div>
          <div class="d" id="clock-d"></div>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="print-area"></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   TOOLFLUX MACHINING LOG  v3
   Component-job-centric. Insert lifecycle per station. Offline.
   ═══════════════════════════════════════════════════════════════ */

'use strict';

// ── constants ────────────────────────────────────────────────────
const DB_KEY = 'toolflux.machlog.v3';

// ── sync config (replaced per customer by build-share.ps1) ───────
const SYNC_URL = 'https://script.google.com/macros/s/AKfycby9Oxpd93RyDIiU1l1TmnB8rISiYQ-U5oDCICYxIPS5IBtyd2YPPWtpmteCWnafVqdx5A/exec';   // Google Apps Script web app URL
const CUSTOMER_ID = 'acme-tools';   // e.g. 'acme-tools' — set by build script
let _syncTimer = null;

const OP_TYPES = [
  ['turning',         'Turning',          'op-turn'],
  ['face_milling',    'Face Milling',     'op-mill'],
  ['end_milling',     'End Milling',      'op-mill'],
  ['slot_milling',    'Slot Milling',     'op-mill'],
  ['udrill',          'U-Drill',          'op-drill'],
  ['twist_drill',     'Twist Drill',      'op-drill'],
  ['boring',          'Boring',           'op-bore'],
  ['reaming',         'Reaming',          'op-ream'],
  ['tapping',         'Tapping',          'op-tap'],
  ['threading',       'Threading',        'op-tap'],
  ['chamfering',      'Chamfering',       'op-drill'],
  ['counter_boring',  'Counter Boring',   'op-bore'],
  ['counter_sinking', 'Counter Sinking',  'op-bore'],
  ['grooving',        'Grooving',         'op-turn'],
  ['other',           'Other',            'op-other'],
];

const OP_MAP = Object.fromEntries(OP_TYPES.map(([k, label, cls]) => [k, { label, cls }]));
const MACHINES = ['CNC-01', 'VMC-02', 'VMC-01', 'CNC-02', 'LT-01', 'LT-02'];

// ── helpers ───────────────────────────────────────────────────────
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = () => Math.random().toString(36).slice(2, 10);
const isoNow = () => new Date().toISOString();
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) };
const fmtTime = iso => { const d = new Date(iso); return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase() };
const fmtDT = iso => `${fmtDate(iso)} ${fmtTime(iso)}`;
const fmtN = (n, d=0) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtRs = (n, d=2) => n == null || isNaN(n) ? '—' : '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
const toast = (msg, type='', dur=2600) => {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type+'-t' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), dur);
};

// ── db ───────────────────────────────────────────────────────────
const blankDB = () => ({
  v: 3,
  jobs: [],
  settings: {
    company: '',
    defaultOperator: '',
    defaultMachine: 'VMC-02',
    avgReplaceTimeMins: 3,
    avgIndexTimeMins: 0.5,
  },
  history: {
    operators: [],
    machines: [...MACHINES],
    componentCodes: [],
    componentDescs: [],
    customers: [],
    insertDesigs: [],
    insertGrades: [],
    insertBrands: [],
    toolHolders: [],
    stationNames: [],
  },
});

let db;

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) { db = JSON.parse(raw); }
    else { db = blankDB(); }
    if (!Array.isArray(db.jobs)) db.jobs = [];
    if (!db.settings) db.settings = blankDB().settings;
    if (!db.history) db.history = blankDB().history;
  } catch(e) {
    console.error('DB load error', e);
    db = blankDB();
  }
}

function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e) { console.error('DB save error', e); toast('Save failed — storage full?', 'bad'); return; }
  scheduleSyncDebounced();
}

function scheduleSyncDebounced() {
  if (!SYNC_URL) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(silentSync, 4000);
}

function silentSync() {
  if (!SYNC_URL) return;
  const payload = JSON.stringify({
    customerId: CUSTOMER_ID || 'unknown',
    syncedAt: new Date().toISOString(),
    jobs: db.jobs || [],
    settings: { company: db.settings.company, defaultMachine: db.settings.defaultMachine },
  });
  try {
    fetch(SYNC_URL, {
      method: 'POST',
      body: payload,
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
    }).catch(() => {});
  } catch(_) {}
}

function addHistory(key, val) {
  if (!val || !String(val).trim()) return;
  const v = String(val).trim();
  if (!db.history[key]) db.history[key] = [];
  const arr = db.history[key];
  const idx = arr.findIndex(x => String(x).toLowerCase() === v.toLowerCase());
  if (idx === 0) return;
  if (idx > 0) arr.splice(idx, 1);
  arr.unshift(v);
  if (arr.length > 60) arr.length = 60;
}

function datalist(id, histKey) {
  const dl = document.getElementById(id);
  if (!dl) return;
  const items = db.history[histKey] || [];
  dl.innerHTML = items.map(v => `<option value="${esc(v)}">`).join('');
}

// ── calculations ─────────────────────────────────────────────────

function calcStation(st) {
  const sets = st.insertSets || [];
  const insertsInCutter = Math.max(1, Number(st.insertsInCutter) || 1);
  const cornersPerInsert = Math.max(1, Number(st.cuttingCornersPerInsert) || 1);
  const costPer = Number(st.insertCostPer) || 0;
  const setCost = insertsInCutter * costPer;
  const totalCorners = cornersPerInsert;

  const activeSet = sets.find(s => s.status === 'active') || null;
  const spentSets = sets.filter(s => s.status !== 'active');

  const totalComponents = sets.reduce((s, set) =>
    s + (set.corners || []).reduce((cs, c) => cs + (c.componentsMade || 0), 0), 0);

  let currentSetNum = null;
  let currentCornerNum = null;
  let currentCornerPcs = null;

  if (activeSet) {
    currentSetNum = sets.indexOf(activeSet) + 1;
    const ac = (activeSet.corners || []).find(c => c.status === 'active');
    if (ac) {
      currentCornerNum = ac.num;
      currentCornerPcs = ac.componentsMade || 0;
    }
  }

  const allIndexed = sets.flatMap(s => (s.corners || []).filter(c => c.status === 'indexed' && (c.componentsMade || 0) > 0));
  const avgCornerLife = allIndexed.length > 0
    ? allIndexed.reduce((s, c) => s + c.componentsMade, 0) / allIndexed.length
    : null;

  const finishedSets = spentSets.filter(s => s.status === 'spent');
  const finishedPcs = finishedSets.reduce((s, set) =>
    s + (set.corners || []).reduce((cs, c) => cs + (c.componentsMade || 0), 0), 0);
  const finishedCost = finishedSets.length * setCost;
  const confirmedCpc = finishedPcs > 0 && finishedCost > 0 ? finishedCost / finishedPcs : null;

  const totalCostCommitted = sets.length * setCost;
  const provisionalCpc = totalComponents > 0 && totalCostCommitted > 0
    ? totalCostCommitted / totalComponents : null;

  const anomalies = [];
  if (avgCornerLife && avgCornerLife > 0) {
    sets.forEach((set, si) => {
      (set.corners || []).forEach(c => {
        if (c.status === 'broken') {
          const ratio = (c.componentsMade || 0) / avgCornerLife;
          if (ratio < 0.55) {
            anomalies.push({
              setNum: si + 1,
              cornerNum: c.num,
              pcs: c.componentsMade || 0,
              avgLife: Math.round(avgCornerLife),
            });
          }
        }
      });
    });
  }

  return {
    sets, activeSet, spentSets,
    insertsInCutter, cornersPerInsert, totalCorners, costPer, setCost,
    totalComponents, currentSetNum, currentCornerNum, currentCornerPcs,
    avgCornerLife, confirmedCpc, provisionalCpc,
    totalCostCommitted, finishedPcs, anomalies,
  };
}

function calcJob(job) {
  const log = job.productionLog || [];
  const totalProduced = log.reduce((s, e) => s + (Number(e.qty) || 0), 0);

  const lastEntry = log.length > 0 ? log[log.length - 1] : null;
  const avgCycleTime = (() => {
    const withCt = log.filter(e => e.cycleTimeMins > 0);
    if (!withCt.length) return null;
    return withCt.reduce((s, e) => s + e.cycleTimeMins, 0) / withCt.length;
  })();

  let totalInsertCost = 0;
  let totalAnomalies = 0;
  (job.stations || []).forEach(st => {
    const sc = calcStation(st);
    totalInsertCost += sc.totalCostCommitted;
    totalAnomalies += sc.anomalies.length;
  });

  const totalCpc = totalProduced > 0 && totalInsertCost > 0
    ? totalInsertCost / totalProduced : null;

  return { totalProduced, totalInsertCost, totalCpc, totalAnomalies, lastEntry, avgCycleTime };
}

// ── router / ui state ─────────────────────────────────────────────
const ui = {
  view: 'jobs',
  jobId: null,
  stationId: null,
  logOpen: false,
  addStationOpen: false,
  tab: 'active',
};

function navigate(view, params = {}) {
  ui.view = view;
  ui.jobId = params.jobId || null;
  ui.stationId = params.stationId || null;
  ui.logOpen = false;
  ui.addStationOpen = false;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ── op type utils ─────────────────────────────────────────────────
function opLabel(opType) { return (OP_MAP[opType] || OP_MAP.other).label; }
function opCls(opType) { return (OP_MAP[opType] || OP_MAP.other).cls; }
function opBadge(opType) {
  return `<span class="badge-op ${opCls(opType)}">${esc(opLabel(opType))}</span>`;
}
function opSelectOptions(selected) {
  return OP_TYPES.map(([v, lbl]) =>
    `<option value="${v}"${selected===v?' selected':''}>${lbl}</option>`
  ).join('');
}

// ── pips ─────────────────────────────────────────────────────────
function cornerPips(set, totalCorners) {
  const corners = set ? (set.corners || []) : [];
  const maxVis = Math.min(totalCorners, 12);
  let html = '';
  for (let i = 1; i <= maxVis; i++) {
    const c = corners.find(x => x.num === i);
    let cls = 'empty';
    if (c) {
      if (c.status === 'active') cls = 'current';
      else if (c.status === 'broken') cls = 'broken';
      else cls = 'done';
    }
    html += `<span class="pip ${cls}" title="Corner ${i}"></span>`;
  }
  return html;
}

// ── station tile ─────────────────────────────────────────────────
function stationTile(st, jobId) {
  const sc = calcStation(st);
  const hasInserts = (st.insertSets || []).length > 0;
  let tierClass = '';
  if (sc.anomalies.length) tierClass = 'bad-st';
  else if (sc.currentCornerNum && sc.avgCornerLife && sc.currentCornerPcs > sc.avgCornerLife * 0.75) tierClass = 'warn-st';

  let statusHtml = '';
  if (!hasInserts) {
    statusHtml = `<div class="no-insert-lbl">No inserts loaded</div>`;
  } else {
    const pip = cornerPips(sc.activeSet, sc.totalCorners);
    const setLabel = sc.currentSetNum ? `Set ${sc.currentSetNum}` : `${(st.insertSets||[]).length} sets`;
    const cLabel = sc.currentCornerNum ? `C${sc.currentCornerNum}/${sc.totalCorners}` : 'Spent';
    statusHtml = `
      <div class="pip-row">${pip}</div>
      <div class="st-corner-lbl">${esc(setLabel)} &middot; ${esc(cLabel)}</div>
      <div class="st-corner-sub">${fmtN(sc.currentCornerPcs)} pcs on corner</div>
    `;
  }

  return `
    <div class="station-tile ${tierClass}" role="button" tabindex="0"
      onclick="navigate('station',{jobId:'${jobId}',stationId:'${st.id}'})"
      onkeydown="if(event.key==='Enter')navigate('station',{jobId:'${jobId}',stationId:'${st.id}'})">
      <span class="st-type badge-op ${opCls(st.opType)}">${esc(opLabel(st.opType))}</span>
      <div class="st-name">${esc(st.name)}</div>
      <div class="st-sub">${esc(st.machine||'')}${st.insertDesig ? ' · ' + esc(st.insertDesig) : ''}</div>
      ${statusHtml}
    </div>`;
}

// ── views ─────────────────────────────────────────────────────────

function vJobs() {
  const filter = ui.tab;
  const jobs = (db.jobs || []).filter(j => {
    if (filter === 'active') return (j.status||'active') === 'active';
    if (filter === 'complete') return j.status === 'complete';
    if (filter === 'paused') return j.status === 'paused';
    return true;
  }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const tabs = [
    ['active', 'Active'],
    ['paused', 'Paused'],
    ['complete', 'Complete'],
    ['all', 'All'],
  ];

  const tabHtml = tabs.map(([key, lbl]) => {
    const count = key === 'all' ? db.jobs.length : db.jobs.filter(j => (j.status||'active') === key).length;
    const active = ui.tab === key ? 'aria-selected="true"' : '';
    return `<button class="tab" ${active} onclick="setJobFilter('${key}')">${lbl}${count ? `<span class="n">${count}</span>` : ''}</button>`;
  }).join('');
  tabHtml && setTabs(tabHtml + `<button class="tab" onclick="navigate('settings')" style="margin-left:auto">Settings</button>`);
  setBarCrumb('', false);

  let listHtml = '';
  if (!jobs.length) {
    listHtml = `
      <div style="text-align:center;padding:3.5rem 1rem;color:var(--mut)">
        <div style="font-size:2rem;margin-bottom:.6rem">&#9881;</div>
        <div style="font-weight:700;color:var(--navy);margin-bottom:.4rem">No ${filter === 'all' ? '' : filter + ' '}jobs</div>
        <div style="font-size:.78rem">${filter === 'all' ? 'Create your first component job to start tracking' : 'No jobs with this status'}</div>
      </div>`;
  } else {
    listHtml = jobs.map(j => {
      const jc = calcJob(j);
      const stations = j.stations || [];
      const healthDots = stations.map(st => {
        const sc = calcStation(st);
        let cls = '';
        if (sc.anomalies.length) cls = 'bad';
        else if (!(st.insertSets||[]).length) cls = 'empty';
        return `<span class="health-dot ${cls}" title="${esc(st.name)}"></span>`;
      }).join('');

      const statusBadge = `<span class="job-status-badge ${j.status||'active'}">${j.status||'active'}</span>`;
      return `
        <div class="job-row" onclick="navigate('job',{jobId:'${j.id}'})" role="button" tabindex="0"
          onkeydown="if(event.key==='Enter')navigate('job',{jobId:'${j.id}'})">
          <div>
            <div><span class="job-code">${esc(j.componentCode)}</span>${statusBadge}</div>
            <div class="job-desc">${esc(j.componentDesc || '')}${j.customer ? ' — ' + esc(j.customer) : ''}</div>
            <div class="job-meta">${fmtDate(j.createdAt)} &middot; ${stations.length} station${stations.length===1?'':'s'}
              ${jc.totalAnomalies ? ` &middot; <span style="color:var(--bad);font-weight:700">${jc.totalAnomalies} anomal${jc.totalAnomalies===1?'y':'ies'}</span>` : ''}
            </div>
            <div class="job-health" style="margin-top:.35rem">${healthDots}</div>
          </div>
          <div>
            <div class="job-count">${fmtN(jc.totalProduced)}</div>
            <div class="job-count-lbl">pcs made</div>
            ${jc.totalCpc ? `<div style="font-family:var(--mono);font-size:.72rem;color:var(--mut);text-align:right;margin-top:.2rem">${fmtRs(jc.totalCpc,2)}/pc</div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  return `
    <div class="jobs-hd">
      <h2>Component Jobs</h2>
      <div style="display:flex;gap:.45rem;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="exportToExcel()" title="Export all data to Excel">&#8595; Excel</button>
        <button class="btn btn-pri" onclick="navigate('newjob')">+ New Job</button>
      </div>
    </div>
    <div class="panel">
      <div id="jobs-list">${listHtml}</div>
    </div>`;
}

function vNewJob() {
  setTabs(`<button class="tab" onclick="navigate('jobs')">&#8592; Jobs</button><button class="tab" aria-selected="true">New Job</button>`);
  setBarCrumb('New Job', true);
  setTimeout(buildDataLists, 0);
  return `
    <div class="panel">
      <div class="panel-hd">
        <span class="lbl">Component Job</span>
        <div class="hr"></div>
      </div>
      <div class="panel-bd">
        <form id="new-job-form" onsubmit="submitNewJob(event)">
          <div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
            <div class="field" style="grid-column:1/-1">
              <label for="nj-code">Component Code <span class="req">*</span></label>
              <input id="nj-code" list="dl-codes" autocomplete="off" placeholder="e.g. FC-2041" required>
              <datalist id="dl-codes"></datalist>
            </div>
            <div class="field" style="grid-column:1/-1">
              <label for="nj-desc">Description</label>
              <input id="nj-desc" list="dl-descs" autocomplete="off" placeholder="e.g. Gear Flange EN8">
              <datalist id="dl-descs"></datalist>
            </div>
            <div class="field">
              <label for="nj-cust">Customer / Job No.</label>
              <input id="nj-cust" list="dl-custs" autocomplete="off" placeholder="Optional">
              <datalist id="dl-custs"></datalist>
            </div>
            <div class="field">
              <label for="nj-op">Created By</label>
              <input id="nj-op" list="dl-ops" autocomplete="off" placeholder="Operator name" value="${esc(db.settings.defaultOperator||'')}">
              <datalist id="dl-ops"></datalist>
            </div>
            <div class="field" style="grid-column:1/-1">
              <label for="nj-notes">Notes</label>
              <textarea id="nj-notes" placeholder="Any setup or material notes"></textarea>
            </div>
          </div>
          <div style="display:flex;gap:.55rem;margin-top:1.1rem;flex-wrap:wrap">
            <button type="submit" class="btn btn-pri btn-lg">Create Job &#8594;</button>
            <button type="button" class="btn btn-ghost" onclick="navigate('jobs')">Cancel</button>
          </div>
        </form>
      </div>
    </div>`;
}

function vJobDetail() {
  const job = db.jobs.find(j => j.id === ui.jobId);
  if (!job) { navigate('jobs'); return ''; }

  const jc = calcJob(job);
  const stations = job.stations || [];
  const log = (job.productionLog || []).slice().reverse();

  const tabHtml = `
    <button class="tab" onclick="navigate('jobs')">&#8592; Jobs</button>
    <button class="tab" aria-selected="true">${esc(job.componentCode)}</button>
    <button class="tab" onclick="navigate('report',{jobId:'${job.id}'})">Report</button>
    <button class="tab" onclick="navigate('settings')" style="margin-left:auto">Settings</button>
  `;
  setTabs(tabHtml);
  setBarCrumb(job.componentCode, true);
  setTimeout(buildDataLists, 0);

  const stationTiles = stations.map(st => stationTile(st, job.id)).join('');
  const addTile = `
    <button class="add-tile" onclick="toggleAddStation()" title="Add tooling station">
      <span class="plus">+</span>
      <span>Add Station</span>
    </button>`;

  const statusOptions = ['active','paused','complete'].map(s =>
    `<option value="${s}"${(job.status||'active')===s?' selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`
  ).join('');

  let logHtml = '';
  if (!log.length) {
    logHtml = `<div style="padding:.9rem 1rem;color:var(--mut);font-size:.78rem">No production logged yet.</div>`;
  } else {
    const rows = log.map(entry => {
      const evChips = (entry.events || []).map(ev => {
        const st = stations.find(s => s.id === ev.stationId);
        const stName = st ? st.name : '?';
        let cls = ev.eventType === 'corner_index' ? 'index' : ev.eventType === 'insert_replace' ? 'replace' : 'broken';
        let lbl = ev.eventType === 'corner_index' ? 'Idx' : ev.eventType === 'insert_replace' ? 'Rpl' : 'Brk';
        return `<span class="ev-chip ${cls}" title="${esc(stName)}: ${ev.eventType}">${esc(stName)} &middot; ${lbl}</span>`;
      }).join('');
      return `
        <tr>
          <td class="ts-cell">${fmtDate(entry.timestamp)}<br><span style="color:var(--mut)">${fmtTime(entry.timestamp)}</span></td>
          <td>${esc(entry.operator || '—')}</td>
          <td class="mono" style="color:var(--mut)">${esc(entry.machine || '—')}</td>
          <td class="qty-cell">${fmtN(entry.qty)}</td>
          <td class="mono">${entry.cycleTimeMins > 0 ? fmtN(entry.cycleTimeMins,1)+' min' : '—'}</td>
          <td><div class="ev-chips">${evChips || '—'}</div></td>
        </tr>`;
    }).join('');

    logHtml = `
      <div class="log-tbl-wrap">
        <table class="log-tbl">
          <thead><tr>
            <th>Date / Time</th><th>Operator</th><th>Machine</th><th>Qty</th><th>Cycle</th><th>Events</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  const cpcHtml = jc.totalCpc != null
    ? `<span class="s-val">${fmtRs(jc.totalCpc,2)}</span><span class="s-unit"> /pc</span>`
    : `<span class="s-val muted" style="font-size:1rem">Pending</span>`;
  const ctHtml = jc.avgCycleTime != null
    ? `<span class="s-val">${fmtN(jc.avgCycleTime,1)}</span><span class="s-unit"> min</span>`
    : `<span class="s-val muted" style="font-size:1rem">—</span>`;

  return `
    <div class="job-hero">
      <div class="hero-top">
        <div class="hero-main">
          <div class="hero-code">${esc(job.componentCode)}</div>
          <div class="hero-desc">${esc(job.componentDesc || '')}${job.customer ? ' — ' + esc(job.customer) : ''}</div>
          <div class="hero-meta">
            Started ${fmtDate(job.createdAt)}
            ${jc.lastEntry ? ' &middot; Last run ' + fmtDate(jc.lastEntry.timestamp) : ''}
            &middot; <select style="background:none;border:0;color:rgba(255,255,255,.45);font-size:.62rem;padding:0;cursor:pointer"
              onchange="setJobStatus('${job.id}',this.value)">${statusOptions}</select>
          </div>
        </div>
        <div class="hero-count-wrap">
          <div class="hero-num">${fmtN(jc.totalProduced)}</div>
          <div class="hero-num-lbl">Pcs Made</div>
        </div>
      </div>
      <div class="hero-acts">
        <button class="btn btn-teal btn-lg" onclick="toggleLogForm()">${ui.logOpen ? '&#10005; Close' : '+ Log Production'}</button>
        <button class="btn btn-ghost" onclick="navigate('report',{jobId:'${job.id}'})">Owner Report</button>
      </div>
    </div>

    ${ui.logOpen ? `<div id="log-form-container" style="margin-top:.85rem">${buildLogForm(job)}</div>` : ''}

    ${jc.totalAnomalies ? `
      <div class="anomaly-flag" style="margin-top:.85rem">
        <span class="ic">&#9888;</span>
        <div>
          <div class="msg">${jc.totalAnomalies} insert anomal${jc.totalAnomalies===1?'y':'ies'} detected</div>
          <div class="detail">Early insert replacement found. View Owner Report for details.</div>
        </div>
      </div>` : ''}

    <div class="panel" style="margin-top:.85rem;margin-bottom:.5rem">
      <div class="panel-hd">
        <span class="lbl">Tooling Stations</span>
        <div class="hr"></div>
        <span class="lbl muted">${stations.length} station${stations.length===1?'':'s'}</span>
      </div>
      <div class="station-scroll">
        ${stationTiles}
        ${addTile}
      </div>
    </div>

    ${ui.addStationOpen ? `<div id="add-station-container" class="panel" style="margin-bottom:.5rem">${buildAddStationForm(job)}</div>` : ''}

    <div class="panel" style="margin-bottom:.5rem">
      <div class="stat-strip">
        <div class="s-stat">
          <div class="lbl">Insert CPC</div>
          <div>${cpcHtml}</div>
          <div class="s-sub">Cost per component (inserts)</div>
        </div>
        <div class="s-stat">
          <div class="lbl">Avg Cycle Time</div>
          <div>${ctHtml}</div>
          <div class="s-sub">Per component</div>
        </div>
        <div class="s-stat">
          <div class="lbl">Insert Cost</div>
          <div><span class="s-val">${fmtRs(jc.totalInsertCost,0)}</span></div>
          <div class="s-sub">Total committed</div>
        </div>
        <div class="s-stat">
          <div class="lbl">Anomalies</div>
          <div><span class="s-val ${jc.totalAnomalies ? 'bad-c' : ''}">${fmtN(jc.totalAnomalies)}</span></div>
          <div class="s-sub">Early insert changes</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-hd">
        <span class="lbl">Production Log</span>
        <div class="hr"></div>
        <span class="lbl muted">${log.length} entr${log.length===1?'y':'ies'}</span>
      </div>
      ${logHtml}
    </div>`;
}

function buildLogForm(job) {
  const stations = job.stations || [];
  const stRows = stations.map(st => {
    const sc = calcStation(st);
    const noInsert = (st.insertSets || []).length === 0;
    const opts = noInsert
      ? `<option value="none">No inserts loaded</option>`
      : `<option value="none" selected>No change</option>
         <option value="corner_index">Corner Indexed</option>
         <option value="insert_replace">Insert Replaced (normal)</option>
         <option value="insert_replace_broken">Insert Replaced (broken)</option>`;
    const setInfo = sc.currentSetNum
      ? `Set ${sc.currentSetNum} · Corner ${sc.currentCornerNum||'?'}/${sc.totalCorners}`
      : 'No active insert';
    return `
      <div class="ev-station-row">
        <div>
          <div class="ev-st-name">${esc(st.name)}</div>
          <div class="ev-st-sub small muted">${esc(setInfo)}</div>
        </div>
        <div class="field" style="margin:0">
          <select name="ev_${st.id}" id="ev_${st.id}" ${noInsert ? 'disabled' : ''}>${opts}</select>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="log-form-wrap">
      <div class="log-form-hd">
        <span class="lbl" style="color:rgba(255,255,255,.65)">Log Production</span>
        <span class="title">Record output + tooling events</span>
      </div>
      <div class="log-form-bd">
        <form id="log-prod-form" onsubmit="submitLogProduction(event,'${job.id}')">
          <div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:.6rem">
            <div class="field">
              <label>Qty Produced <span class="req">*</span></label>
              <div class="qty-row" style="flex-wrap:nowrap;gap:.3rem;margin-bottom:0">
                <input id="lp-qty" type="number" min="1" max="9999" class="qty-inp" placeholder="0" required autofocus>
                <div style="display:flex;flex-direction:column;gap:.22rem">
                  <button type="button" class="qty-adj" onclick="adjQty(5)">+5</button>
                  <button type="button" class="qty-adj" onclick="adjQty(10)">+10</button>
                </div>
                <div style="display:flex;flex-direction:column;gap:.22rem">
                  <button type="button" class="qty-adj" onclick="adjQty(25)">+25</button>
                  <button type="button" class="qty-adj" onclick="adjQty(100)">+100</button>
                </div>
              </div>
            </div>
            <div class="field">
              <label for="lp-op">Operator</label>
              <input id="lp-op" list="dl-ops-lp" autocomplete="off" placeholder="Name" value="${esc(db.settings.defaultOperator||'')}">
              <datalist id="dl-ops-lp"></datalist>
            </div>
            <div class="field">
              <label for="lp-mach">Machine</label>
              <input id="lp-mach" list="dl-machs-lp" autocomplete="off" placeholder="Machine" value="${esc(db.settings.defaultMachine||'')}">
              <datalist id="dl-machs-lp"></datalist>
            </div>
            <div class="field">
              <label for="lp-ct">Cycle Time (min)</label>
              <input id="lp-ct" type="number" min="0" step="0.1" placeholder="e.g. 2.5">
            </div>
          </div>
          ${stations.length ? `
            <div class="lbl" style="margin-bottom:.4rem">Tooling Events <span class="muted" style="font-size:.62rem;font-weight:400;letter-spacing:0;text-transform:none">-- select only if something changed this run</span></div>
            <div class="ev-station-list">${stRows}</div>

          <div class="field" style="margin-top:.6rem">
            <label for="lp-notes">Notes (optional)</label>
            <input id="lp-notes" placeholder="Any notes for this run">
          </div>
          <div style="display:flex;gap:.5rem;margin-top:.85rem;flex-wrap:wrap">
            <button type="submit" class="btn btn-teal btn-lg">Log Production</button>
            <button type="button" class="btn btn-ghost" onclick="toggleLogForm()">Cancel</button>
          </div>

}

function vStationDetail() {
  const job = db.jobs.find(j => j.id === ui.jobId);
  if (!job) { navigate('jobs'); return ''; }
  const st = (job.stations || []).find(s => s.id === ui.stationId);
  if (!st) { navigate('job', { jobId: job.id }); return ''; }

  const sc = calcStation(st);
  const tabHtml = `
    <button class="tab" onclick="navigate('jobs')">&#8592; Jobs</button>
    <button class="tab" onclick="navigate('job',{jobId:'${job.id}'})">${esc(job.componentCode)}</button>
    <button class="tab" aria-selected="true">${esc(st.name)}</button>
  `;
  setTabs(tabHtml);
  setBarCrumb(`${job.componentCode} / ${st.name}`, true);

  let setsHtml = '';
  if (!sc.sets.length) {
    setsHtml = `
      <div style="padding:.85rem 1rem">
        <div class="muted small" style="margin-bottom:.75rem">No inserts loaded yet.</div>
        <button class="btn btn-pri" onclick="loadFirstSet('${job.id}','${st.id}')">Load First Insert Set</button>
      </div>`;
  } else {
    setsHtml = [...sc.sets].reverse().map((set, ri) => {
      const si = sc.sets.length - ri;
      const corners = set.corners || [];
      const totalPcs = corners.reduce((s, c) => s + (c.componentsMade || 0), 0);
      const cpc = totalPcs > 0 && sc.setCost > 0 ? sc.setCost / totalPcs : null;
      const pip = cornerPips(set, sc.totalCorners);

      const cornerRows = corners.map(c => {
        const rowClass = c.status === 'active' ? 'active-row' : c.status === 'broken' ? 'broken-row' : '';
        const warn = sc.avgCornerLife && c.status === 'broken' && (c.componentsMade||0) < sc.avgCornerLife * 0.55;
        return `
          <tr class="${rowClass}">
            <td>C${c.num}</td>
            <td>${esc(c.status)}</td>
            <td class="n">${fmtN(c.componentsMade || 0)}</td>
            <td class="n">${sc.avgCornerLife ? fmtN(sc.avgCornerLife, 0) : '—'}</td>
            <td class="n" style="${warn ? 'color:var(--bad);font-weight:700' : ''}">${warn ? '&#9888; Early' : c.status === 'active' ? '<span class="lbl-t">ACTIVE</span>' : 'OK'}</td>
            <td>${c.endedAt ? fmtDate(c.endedAt) : c.status === 'active' ? 'Running' : '—'}</td>
          </tr>`;
      }).join('');

      const badgeClass = set.status === 'active' ? 'active' : set.status === 'broken' ? 'broken' : 'spent';
      return `
        <div class="set-block">
          <div class="set-hd">
            <span class="set-badge ${badgeClass}">SET #${si}</span>
            <div class="pip-row" style="margin:0 .5rem 0 .3rem">${pip}</div>
            <span class="small muted">${fmtDate(set.loadedAt)}${set.loadedBy ? ' · ' + esc(set.loadedBy) : ''}</span>
            <span class="small mono" style="margin-left:auto">${fmtN(totalPcs)} pcs &middot; ${fmtRs(cpc,2)}/pc</span>
          </div>
          <table class="corner-tbl">
            <thead><tr>
              <th>Corner</th><th>Status</th><th>Pcs Made</th><th>Avg Life</th><th>Flag</th><th>Ended</th>
            </tr></thead>
            <tbody>${cornerRows}</tbody>
          </table>
        </div>`;
    }).join('');
  }

  const cpcConfirmed = sc.confirmedCpc != null
    ? `<span class="s-val ok-c">${fmtRs(sc.confirmedCpc,2)}</span><span class="s-unit"> /pc</span>`
    : `<span class="s-val muted" style="font-size:.9rem">No completed sets</span>`;
  const cpcProv = sc.provisionalCpc != null
    ? `<span class="s-val">${fmtRs(sc.provisionalCpc,2)}</span><span class="s-unit"> /pc</span>`
    : `<span class="s-val muted">—</span>`;

  return `
    <div class="panel" style="margin-bottom:.8rem">
      <div class="panel-hd">
        ${opBadge(st.opType)}
        <span style="font-weight:700;color:var(--navy);margin-left:.3rem">${esc(st.name)}</span>
        <div class="hr"></div>
        <span class="muted small">${esc(st.machine||'')}${st.insertDesig ? ' · ' + esc(st.insertDesig) : ''}${st.insertGrade ? ' ' + esc(st.insertGrade) : ''}</span>
      </div>
      <div class="stat-strip">
        <div class="s-stat">
          <div class="lbl">Confirmed CPC</div>
          <div>${cpcConfirmed}</div>
          <div class="s-sub">From fully spent sets only</div>
        </div>
        <div class="s-stat">
          <div class="lbl">Provisional CPC</div>
          <div>${cpcProv}</div>
          <div class="s-sub">Incl. active set at full cost</div>
        </div>
        <div class="s-stat">
          <div class="lbl">Total Components</div>
          <div><span class="s-val">${fmtN(sc.totalComponents)}</span></div>
          <div class="s-sub">All insert sets combined</div>
        </div>
        <div class="s-stat">
          <div class="lbl">Avg Corner Life</div>
          <div><span class="s-val">${sc.avgCornerLife ? fmtN(sc.avgCornerLife,0) : '—'}</span></div>
          <div class="s-sub">Pcs per corner (historical)</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd">
        <span class="lbl">Insert Lifecycle</span>
        <div class="hr"></div>
        <span class="small muted">${sc.insertsInCutter} insert${sc.insertsInCutter>1?'s':''} &middot; ${sc.totalCorners} corner${sc.totalCorners>1?'s':''} per set &middot; ${fmtRs(sc.setCost,0)}/set</span>
        <div style="margin-left:auto">
          ${sc.activeSet
            ? `<button class="btn btn-ghost" style="font-size:.56rem;min-height:28px;padding:.2rem .6rem" onclick="loadNewSet('${job.id}','${st.id}')">Replace Inserts</button>`
            : `<button class="btn btn-pri" style="font-size:.56rem;min-height:28px;padding:.2rem .6rem" onclick="loadFirstSet('${job.id}','${st.id}')">Load Inserts</button>`}
        </div>
      </div>
      <div style="padding:.85rem 1rem .75rem">${setsHtml}</div>
    </div>
    <div style="display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.5rem">
      <button class="btn btn-bad" onclick="confirmDeleteStation('${job.id}','${st.id}')">Delete Station</button>
    </div>`;
}

function vReport() {
  const job = db.jobs.find(j => j.id === ui.jobId);
  if (!job) { navigate('jobs'); return ''; }

  const jc = calcJob(job);
  const tabHtml = `
    <button class="tab" onclick="navigate('job',{jobId:'${job.id}'})">&#8592; ${esc(job.componentCode)}</button>
    <button class="tab" aria-selected="true">Owner Report</button>
  `;
  setTabs(tabHtml);
  setBarCrumb(`Report: ${job.componentCode}`, true);

  const log = job.productionLog || [];
  const dateRange = log.length > 0
    ? `${fmtDate(log[0].timestamp)} – ${fmtDate(log[log.length-1].timestamp)}`
    : 'No production logged';
  const operators = [...new Set(log.map(e => e.operator).filter(Boolean))].join(', ') || '—';
  const machines  = [...new Set(log.map(e => e.machine).filter(Boolean))].join(', ') || '—';

  const stationRows = (job.stations || []).map(st => {
    const sc = calcStation(st);
    const anomalyNote = sc.anomalies.map(a =>
      `C${a.cornerNum} Set${a.setNum}: ${a.pcs}pc (avg ${a.avgLife})`
    ).join('; ');
    const cpcDisplay = sc.confirmedCpc != null
      ? fmtRs(sc.confirmedCpc,2)
      : (sc.provisionalCpc != null ? fmtRs(sc.provisionalCpc,2)+'*' : '—');
    return `
      <tr${sc.anomalies.length ? ' class="flag"' : ''}>
        <td>${esc(st.name)}<br><span style="font-size:7pt;color:#555">${opLabel(st.opType)}</span></td>
        <td class="n">${sc.sets.length}</td>
        <td class="n">${fmtRs(sc.setCost,0)}</td>
        <td class="n">${sc.avgCornerLife != null ? fmtN(sc.avgCornerLife,0) : '—'}</td>
        <td class="n">${fmtN(sc.totalComponents)}</td>
        <td class="n">${cpcDisplay}</td>
        <td>${sc.anomalies.length ? `<b style="color:#a00">&#9888; ${sc.anomalies.length}</b>` : 'OK'}</td>
        <td style="font-size:7pt">${esc(anomalyNote) || '—'}</td>
      </tr>`;
  }).join('');

  const logRows = log.slice().reverse().slice(0, 50).map(e => {
    const evText = (e.events||[]).map(ev => {
      const st = (job.stations||[]).find(s => s.id === ev.stationId);
      return `${st?st.name:'?'}: ${ev.eventType.replace(/_/g,' ')}`;
    }).join('; ');
    return `
      <tr>
        <td>${fmtDate(e.timestamp)}</td>
        <td>${esc(e.operator||'—')}</td>
        <td>${esc(e.machine||'—')}</td>
        <td class="n">${fmtN(e.qty)}</td>
        <td class="n">${e.cycleTimeMins > 0 ? fmtN(e.cycleTimeMins,1)+' min' : '—'}</td>
        <td>${esc(evText)||'—'}</td>
      </tr>`;
  }).join('');

  const reportId = `RPT-${job.componentCode}-${new Date().toISOString().slice(0,10)}`;

  const reportHtml = `
    <div class="report" id="report-inner">

// ── render ─────────────────────────────────────────────────────────
function setTabs(html) {
  const el = $('#tabs');
  if (el) el.innerHTML = html;
}

function setBarCrumb(text, show) {
  const el = $('#bar-crumb');
  if (!el) return;
  if (show && text) { el.style.display = ''; el.textContent = text; }
  else el.style.display = 'none';
}

function buildDataLists() {
  const dlMap = {
    'dl-ops':       'operators',
    'dl-ops-lp':    'operators',
    'dl-ops-st':    'operators',
    'dl-machs':     'machines',
    'dl-machs-lp':  'machines',
    'dl-machs-st':  'machines',
    'dl-codes':     'componentCodes',
    'dl-descs':     'componentDescs',
    'dl-custs':     'customers',
    'dl-desigs':    'insertDesigs',
    'dl-grades':    'insertGrades',
    'dl-brands':    'insertBrands',
    'dl-holders':   'toolHolders',
    'dl-stnames':   'stationNames',
  };
  Object.entries(dlMap).forEach(([id, key]) => datalist(id, key));
}

function render() {
  const view = $('#view');
  if (!view) return;
  let html = '';
  try {
    if (ui.view === 'jobs')      html = vJobs();
    else if (ui.view === 'newjob')    html = vNewJob();
    else if (ui.view === 'job')       html = vJobDetail();
    else if (ui.view === 'station')   html = vStationDetail();
    else if (ui.view === 'report')    html = vReport();
    else if (ui.view === 'settings')  html = vSettings();
    else html = vJobs();
  } catch(e) {
    console.error('Render error', e);
    html = `<div style="padding:2rem;color:var(--bad)">Render error: ${esc(e.message)}<br><pre style="font-size:.7rem;margin-top:.5rem">${esc(e.stack)}</pre></div>`;
  }
  view.innerHTML = html;
  setTimeout(buildDataLists, 0);
}

// ── event handlers ─────────────────────────────────────────────────
function setJobFilter(f) { ui.tab = f; render(); }
function toggleLogForm()    { ui.logOpen = !ui.logOpen; render(); }

function adjQty(n) {

function setJobStatus(jobId, status) {

function submitNewJob(e) {
  e.preventDefault();
  const code = $('#nj-code').value.trim();
  if (!code) { toast('Component code is required', 'bad'); return; }
  const job = {
    id: uid(),
    componentCode: code.toUpperCase(),
    componentDesc: $('#nj-desc').value.trim(),
    customer: $('#nj-cust').value.trim(),
    createdBy: $('#nj-op').value.trim(),
    notes: $('#nj-notes').value.trim(),
    createdAt: isoNow(),
    status: 'active',
    stations: [],
    productionLog: [],
  };
  addHistory('componentCodes', code);
  addHistory('componentDescs', job.componentDesc);
  addHistory('customers', job.customer);
  addHistory('operators', job.createdBy);
  if (!db.settings.defaultOperator && job.createdBy) db.settings.defaultOperator = job.createdBy;
  db.jobs.push(job);
  saveDB();
  toast('Job created', 'ok');
  navigate('job', { jobId: job.id });
}

function submitAddStation(e, jobId) {
  e.preventDefault();
  const job = db.jobs.find(j => j.id === jobId);
  if (!job) return;
  const name = $('#as-name').value.trim();
  if (!name) { toast('Station name required', 'bad'); return; }
  const st = {
    id: uid(),
    name,
    opType: $('#as-op').value,
    machine: $('#as-mach').value.trim(),
    insertDesig: $('#as-desig').value.trim(),
    insertGrade: $('#as-grade').value.trim(),
    insertBrand: $('#as-brand').value.trim(),
    insertsInCutter: parseInt($('#as-n').value)||1,
    cuttingCornersPerInsert: parseInt($('#as-corners').value)||2,
    insertCostPer: parseFloat($('#as-cost').value)||0,
    toolHolder: $('#as-holder').value.trim(),
    insertSets: [],
  };
  const loadNow = $('#as-load-now').checked;
  const loadedBy = $('#as-loaded-by').value.trim();
  if (loadNow) {
    st.insertSets.push({
      id: uid(), loadedAt: isoNow(), loadedBy, status: 'active',
      corners: [{ num: 1, startedAt: isoNow(), endedAt: null, componentsMade: 0, status: 'active' }],
    });
  }
  addHistory('stationNames', name);
  addHistory('insertDesigs', st.insertDesig);
  addHistory('insertGrades', st.insertGrade);
  addHistory('insertBrands', st.insertBrand);
  addHistory('toolHolders', st.toolHolder);
  addHistory('machines', st.machine);
  addHistory('operators', loadedBy);
  job.stations.push(st);
  saveDB();
  ui.addStationOpen = false;
  toast(`Station "${name}" added`, 'ok');

function submitLogProduction(e, jobId) {
  e.preventDefault();
  const job = db.jobs.find(j => j.id === jobId);
  if (!job) return;
  const qty = parseInt($('#lp-qty').value) || 0;
  if (qty < 1) { toast('Enter a quantity', 'bad'); return; }
  const operator = $('#lp-op').value.trim();
  const machine  = $('#lp-mach').value.trim();
  const cycleTimeMins = parseFloat($('#lp-ct').value) || 0;
  const notes = $('#lp-notes').value.trim();

  const events = [];
  (job.stations || []).forEach(st => {
    const sel = $(`#ev_${st.id}`);
    if (!sel || sel.disabled) return;
    const val = sel.value;
    if (val && val !== 'none') events.push({ stationId: st.id, eventType: val, timestamp: isoNow() });
  });

  const entry = { id: uid(), timestamp: isoNow(), operator, machine, cycleTimeMins, qty, notes, events };

  // First: add qty to all active station corners (production happened BEFORE events)
  (job.stations || []).forEach(st => {
    const activeSet = (st.insertSets || []).find(s => s.status === 'active');
    if (activeSet) {
      const ac = (activeSet.corners || []).find(c => c.status === 'active');
      if (ac) ac.componentsMade = (ac.componentsMade || 0) + qty;
    }
  });

  // Then: process tooling events
  events.forEach(ev => {
    const st = (job.stations || []).find(s => s.id === ev.stationId);
    if (st) processStationEvent(st, ev);
  });

  job.productionLog.push(entry);
  addHistory('operators', operator);
  addHistory('machines', machine);
  if (operator) db.settings.defaultOperator = operator;
  if (machine)  db.settings.defaultMachine = machine;
  saveDB();
  ui.logOpen = false;
  toast(`${qty} pcs logged`, 'ok');
  render();
}

function processStationEvent(st, ev) {
  const activeSet = (st.insertSets || []).find(s => s.status === 'active');
  if (!activeSet) return;
  const ac = (activeSet.corners || []).find(c => c.status === 'active');
  if (!ac) return;
  const totalCorners = Number(st.cuttingCornersPerInsert) || 1;
  const ts = ev.timestamp || isoNow();

  if (ev.eventType === 'corner_index') {
    ac.status = 'indexed';
    ac.endedAt = ts;
    const nextNum = ac.num + 1;
    if (nextNum <= totalCorners) {
      activeSet.corners.push({ num: nextNum, startedAt: ts, endedAt: null, componentsMade: 0, status: 'active' });
    } else {
      activeSet.status = 'spent';
    }
  } else if (ev.eventType === 'insert_replace' || ev.eventType === 'insert_replace_broken') {
    ac.status = ev.eventType === 'insert_replace_broken' ? 'broken' : 'indexed';
    ac.endedAt = ts;
    activeSet.status = ev.eventType === 'insert_replace_broken' ? 'broken' : 'spent';
    st.insertSets.push({
      id: uid(), loadedAt: ts, loadedBy: ev.loadedBy || '', status: 'active',
      corners: [{ num: 1, startedAt: ts, endedAt: null, componentsMade: 0, status: 'active' }],
    });
  }
}

function loadFirstSet(jobId, stationId) {
  const job = db.jobs.find(j => j.id === jobId);
  const st = job && (job.stations || []).find(s => s.id === stationId);
  if (!st) return;
  if ((st.insertSets||[]).find(s => s.status === 'active')) { toast('A set is already active', 'bad'); return; }
  st.insertSets.push({
    id: uid(), loadedAt: isoNow(), loadedBy: db.settings.defaultOperator || '', status: 'active',
    corners: [{ num: 1, startedAt: isoNow(), endedAt: null, componentsMade: 0, status: 'active' }],
  });
  saveDB();
  toast('Insert set loaded', 'ok');
  render();
}

function loadNewSet(jobId, stationId) {
  if (!confirm('Load new insert set? This will close the current active set as spent.')) return;
  const job = db.jobs.find(j => j.id === jobId);
  const st = job && (job.stations || []).find(s => s.id === stationId);
  if (!st) return;
  const activeSet = (st.insertSets || []).find(s => s.status === 'active');
  if (activeSet) {
    const ac = (activeSet.corners || []).find(c => c.status === 'active');
    if (ac) { ac.status = 'indexed'; ac.endedAt = isoNow(); }
    activeSet.status = 'spent';
  }
  st.insertSets.push({
    id: uid(), loadedAt: isoNow(), loadedBy: db.settings.defaultOperator || '', status: 'active',
    corners: [{ num: 1, startedAt: isoNow(), endedAt: null, componentsMade: 0, status: 'active' }],
  });
  saveDB();
  toast('New insert set loaded', 'ok');
  render();
}

function confirmDeleteStation(jobId, stationId) {
  if (!confirm('Delete this tooling station and all its insert history? This cannot be undone.')) return;
  const job = db.jobs.find(j => j.id === jobId);
  if (!job) return;
  job.stations = (job.stations || []).filter(s => s.id !== stationId);
  saveDB();
  toast('Station deleted');
  navigate('job', { jobId });
}

function submitSettings(e) {

function exportToExcel() {
  // SpreadsheetML — no library, works offline, opens in Excel & LibreOffice
  const xe = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const sc = (v, t='String') => `<Cell><Data ss:Type="${t}">${xe(v)}</Data></Cell>`;
  const nc = v => (v != null && !isNaN(v)) ? sc(Number(v).toFixed(4),'Number') : sc('');
  const hc = v => `<Cell ss:StyleID="h"><Data ss:Type="String">${xe(v)}</Data></Cell>`;
  const hr = (...vs) => '<Row>' + vs.map(hc).join('') + '</Row>';
  const row = (...cs) => '<Row>' + cs.join('') + '</Row>';

  // ── Sheet 1: Jobs Summary ──────────────────────────────────────
  let s1 = `<Worksheet ss:Name="Jobs Summary"><Table>`;
  s1 += hr('Component Code','Description','Customer','Status','Started','Total Pcs Made','Total Insert Cost (Rs)','Insert CPC (Rs/pc)','Stations','Anomalies');
  (db.jobs || []).forEach(j => {
    const jc = calcJob(j);
    s1 += row(
      sc(j.componentCode), sc(j.componentDesc||''), sc(j.customer||''),
      sc(j.status||'active'), sc(fmtDate(j.createdAt)),
      nc(jc.totalProduced), nc(jc.totalInsertCost), nc(jc.totalCpc),
      nc((j.stations||[]).length), nc(jc.totalAnomalies)
    );
  });
  s1 += '</Table></Worksheet>';

  // ── Sheet 2: Production Log ────────────────────────────────────
  let s2 = `<Worksheet ss:Name="Production Log"><Table>`;
  s2 += hr('Component Code','Description','Date','Time','Operator','Machine','Qty','Cycle Time (min)','Tooling Events','Notes');
  (db.jobs || []).forEach(j => {
    (j.productionLog || []).forEach(entry => {
      const evText = (entry.events||[]).map(ev => {
        const st = (j.stations||[]).find(s => s.id === ev.stationId);
        return `${st?st.name:'?'}: ${ev.eventType.replace(/_/g,' ')}`;
      }).join('; ');
      s2 += row(
        sc(j.componentCode), sc(j.componentDesc||''),
        sc(fmtDate(entry.timestamp)), sc(fmtTime(entry.timestamp)),
        sc(entry.operator||''), sc(entry.machine||''),
        nc(entry.qty),
        entry.cycleTimeMins > 0 ? nc(entry.cycleTimeMins) : sc(''),
        sc(evText), sc(entry.notes||'')
      );
    });
  });
  s2 += '</Table></Worksheet>';

  // ── Sheet 3: Insert CPC by Station ────────────────────────────
  let s3 = `<Worksheet ss:Name="Insert CPC by Station"><Table>`;
  s3 += hr('Component Code','Station Name','Operation Type','Machine',
    'Insert Designation','Insert Grade','Insert Brand',
    'Inserts in Cutter','Corners per Insert','Cost per Insert (Rs)',
    'Set Cost (Rs)','Sets Used','Total Pcs','Avg Corner Life (pcs)',
    'Confirmed CPC (Rs/pc)','Provisional CPC (Rs/pc)','Anomalies');
  (db.jobs || []).forEach(j => {
    (j.stations || []).forEach(st => {
      const sc2 = calcStation(st);
      s3 += row(
        sc(j.componentCode), sc(st.name), sc(opLabel(st.opType)), sc(st.machine||''),
        sc(st.insertDesig||''), sc(st.insertGrade||''), sc(st.insertBrand||''),
        nc(sc2.insertsInCutter), nc(sc2.cornersPerInsert), nc(sc2.costPer),
        nc(sc2.setCost), nc(sc2.sets.length), nc(sc2.totalComponents),
        sc2.avgCornerLife != null ? nc(Math.round(sc2.avgCornerLife)) : sc(''),
        sc2.confirmedCpc != null ? nc(sc2.confirmedCpc) : sc('—'),
        sc2.provisionalCpc != null ? nc(sc2.provisionalCpc) : sc(''),
        nc(sc2.anomalies.length)
      );
    });
  });
  s3 += '</Table></Worksheet>';

  // ── Sheet 4: Anomaly Log ───────────────────────────────────────
  let s4 = `<Worksheet ss:Name="Anomalies"><Table>`;
  s4 += hr('Component Code','Station','Operation','Set #','Corner #','Pcs on Corner','Avg Corner Life (pcs)','% of Avg','Severity');
  (db.jobs || []).forEach(j => {
    (j.stations || []).forEach(st => {
      const sc2 = calcStation(st);
      sc2.anomalies.forEach(a => {
        const pct = sc2.avgCornerLife ? Math.round((a.pcs / sc2.avgCornerLife) * 100) : 0;
        const sev = pct < 30 ? 'CRITICAL' : pct < 55 ? 'WARNING' : 'NOTICE';
        s4 += row(
          sc(j.componentCode), sc(st.name), sc(opLabel(st.opType)),
          nc(a.setNum), nc(a.cornerNum), nc(a.pcs), nc(a.avgLife),
          nc(pct), sc(sev)
        );
      });
    });
  });
  s4 += '</Table></Worksheet>';

  // ── Assemble workbook ─────────────────────────────────────────
  const styles = `<Styles>
    <Style ss:ID="h">
      <Font ss:Bold="1" ss:Color="#FFFFFF"/>
      <Interior ss:Color="#012B42" ss:Pattern="Solid"/>
    </Style>
  </Styles>`;

  const wb = `<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${styles}${s1}${s2}${s3}${s4}</Workbook>`;

  const blob = new Blob(['﻿' + wb], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `machlog-data-${new Date().toISOString().slice(0,10)}.xls`;
  a.click();
  toast('Excel file downloaded', 'ok');
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported.v || !Array.isArray(imported.jobs)) { toast('Invalid format', 'bad'); return; }
        if (!confirm(`Import ${imported.jobs.length} jobs? This replaces all current data.`)) return;
        db = imported;
        if (!db.settings) db.settings = blankDB().settings;
        if (!db.history) db.history = blankDB().history;
        saveDB();
        toast('Data imported', 'ok');
        navigate('jobs');
      } catch(err) { toast('Could not parse file', 'bad'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function confirmClearAll() {
  if (!confirm('Delete ALL jobs and history? This cannot be undone.')) return;
  db = blankDB();
  saveDB();
  toast('All data cleared');
  navigate('jobs');
}

// ── clock ─────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const ct = $('#clock-t'), cd = $('#clock-d');
  if (ct) ct.textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();
  if (cd) cd.textContent = now.toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short' }).toUpperCase();
}

// ── keyboard shortcuts ────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (ui.logOpen) { ui.logOpen = false; render(); }
    else if (ui.addStationOpen) { ui.addStationOpen = false; render(); }
  }
});

// ── expose globals ────────────────────────────────────────────────
Object.assign(window, {
  navigate, setJobFilter, toggleLogForm, toggleAddStation, adjQty,
  setJobStatus, submitNewJob, submitAddStation, submitLogProduction,
  loadFirstSet, loadNewSet, confirmDeleteStation,
  submitSettings, printReport, exportData, exportToExcel, importData, confirmClearAll,
});

// ── init ──────────────────────────────────────────────────────────
loadDB();
render();
updateClock();
setInterval(updateClock, 30000);
// Sync on load (catches up after offline periods) + every 15 min
setTimeout(silentSync, 8000);
setInterval(silentSync, 15 * 60 * 1000);

// Logo fallback for file:// with missing SVG
(function() {
  const img = document.querySelector('.bar-logo img');
  if (!img) return;
  img.onerror = () => {
    const link = img.closest('a');
    if (link) link.innerHTML = '<span style="font-family:var(--mono);font-size:.82rem;font-weight:800;color:var(--navy);letter-spacing:.07em">TOOLFLUX</span>';
  };
})();

</script>
</body>
</html>
